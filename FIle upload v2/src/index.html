<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>File Upload</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="./input.css" />
  </head>

  <body
    class="flex min-h-screen items-center justify-center bg-[#d8d0c7] p-4 text-[#4d4d4d]"
  >
    <div
      class="w-full max-w-[760px] border-[4px] border-[#f28a38] bg-[#f2efe9] shadow-[0_0_0_1px_rgba(68,68,68,0.08)]"
    >
      <header
        class="flex h-[90px] items-center justify-center bg-[#f28a38] text-[clamp(2.1rem,2vw,3rem)] font-extrabold uppercase tracking-[0.04em] text-white"
      >
        FILE UPLOAD
      </header>

      <main class="px-5 pb-6 pt-5">
        <input id="fileInput" type="file" multiple hidden />

        <div class="space-y-[18px]">
          <div class="flex items-center gap-[14px] min-h-[72px]">
            <div
              class="relative h-[60px] w-[52px] border-[2px] border-[#8d8d8d] bg-white/10 shadow-[inset_0_0_0_1px_rgba(255,255,255,0.25)] before:absolute before:-right-[2px] before:-top-[2px] before:h-[16px] before:w-[16px] before:border-b-[2px] before:border-l-[2px] before:border-[#8d8d8d] before:bg-[linear-gradient(135deg,#f5f5f5_0%,#ececec_100%)]"
            >
              <span
                class="absolute bottom-[8px] left-[8px] text-[0.6rem] font-bold uppercase tracking-[0.08em] text-[#7a7a7a]"
                >PNG</span
              >
            </div>

            <div class="flex min-w-0 flex-1 items-center gap-[16px]">
              <span
                class="min-w-0 flex-1 overflow-hidden text-ellipsis whitespace-nowrap text-[clamp(1.15rem,1.5vw,1.7rem)] text-[#464646]"
                >The 22 checks@2x.png</span
              >
              <div
                class="relative h-[22px] flex-[0_0_280px] overflow-hidden rounded-full border-[2px] border-[#54b5e0] bg-[#93d6f2]/35 before:absolute before:inset-0 before:bg-[repeating-linear-gradient(135deg,rgba(255,255,255,0.35)_0,rgba(255,255,255,0.35)_7px,transparent_7px,transparent_14px)]"
              >
                <div
                  class="absolute inset-y-0 left-0 w-[67%] bg-[linear-gradient(90deg,#51c4f2_0%,#7cd8f6_100%)]"
                ></div>
                <span
                  class="absolute right-[10px] top-1/2 -translate-y-1/2 text-[0.72rem] font-bold text-[#34505a]"
                  >67%</span
                >
              </div>
              <button
                class="border-0 bg-transparent text-[0.95rem] font-bold text-[#ef8d32]"
                type="button"
              >
                Pause
              </button>
              <button
                class="border-0 bg-transparent text-[2rem] leading-none text-[#5a5a5a]"
                type="button"
                aria-label="Remove file"
              >
                ×
              </button>
            </div>
          </div>

          <div class="flex items-center gap-[14px] min-h-[72px]">
            <div
              class="relative h-[60px] w-[52px] border-[2px] border-[#8d8d8d] bg-white/10 shadow-[inset_0_0_0_1px_rgba(255,255,255,0.25)] before:absolute before:-right-[2px] before:-top-[2px] before:h-[16px] before:w-[16px] before:border-b-[2px] before:border-l-[2px] before:border-[#8d8d8d] before:bg-[linear-gradient(135deg,#f5f5f5_0%,#ececec_100%)]"
            >
              <span
                class="absolute bottom-[8px] left-[8px] text-[0.6rem] font-bold uppercase tracking-[0.08em] text-[#7a7a7a]"
                >PNG</span
              >
            </div>

            <div class="flex min-w-0 flex-1 items-center gap-[16px]">
              <span
                class="min-w-0 flex-1 overflow-hidden text-ellipsis whitespace-nowrap text-[clamp(1.15rem,1.5vw,1.7rem)] text-[#464646]"
                >How results are decided@2x.png</span
              >
              <div
                class="relative h-[22px] flex-[0_0_280px] overflow-hidden rounded-full border-[2px] border-[#54b5e0] bg-[#93d6f2]/35 before:absolute before:inset-0 before:bg-[repeating-linear-gradient(135deg,rgba(255,255,255,0.35)_0,rgba(255,255,255,0.35)_7px,transparent_7px,transparent_14px)]"
              >
                <div
                  class="absolute inset-y-0 left-0 w-full bg-[linear-gradient(90deg,#51c4f2_0%,#7cd8f6_100%)]"
                ></div>
              </div>
              <div class="ml-auto flex items-center gap-[18px]">
                <button
                  class="border-0 bg-transparent text-[0.95rem] font-bold text-[#ef8d32] underline decoration-solid underline-offset-2"
                  type="button"
                >
                  Share link
                </button>
                <button
                  class="border-0 bg-transparent text-[0.95rem] font-bold text-[#ef8d32] underline decoration-solid underline-offset-2"
                  type="button"
                >
                  View file
                </button>
              </div>
              <div
                class="flex h-[28px] w-[28px] items-center justify-center border border-[#a9a9a9] bg-white/20 text-[1.1rem] text-[#5b5b5b]"
              >
                🗂
              </div>
            </div>
          </div>

          <div class="flex items-center gap-[14px] min-h-[72px]">
            <div
              class="relative h-[60px] w-[52px] border-[2px] border-[#8d8d8d] bg-white/10 shadow-[inset_0_0_0_1px_rgba(255,255,255,0.25)] before:absolute before:-right-[2px] before:-top-[2px] before:h-[16px] before:w-[16px] before:border-b-[2px] before:border-l-[2px] before:border-[#8d8d8d] before:bg-[linear-gradient(135deg,#f5f5f5_0%,#ececec_100%)]"
            >
              <span
                class="absolute bottom-[8px] left-[8px] text-[0.6rem] font-bold uppercase tracking-[0.08em] text-[#7a7a7a]"
                >PNG</span
              >
            </div>

            <div class="flex min-w-0 flex-1 items-center gap-[16px]">
              <span
                class="min-w-0 flex-1 overflow-hidden text-ellipsis whitespace-nowrap text-[clamp(1.15rem,1.5vw,1.7rem)] text-[#464646]"
                >Open items@2x.png</span
              >
              <div
                class="relative h-[22px] flex-[0_0_280px] overflow-hidden rounded-full border-[2px] border-[#54b5e0] bg-[#93d6f2]/35 before:absolute before:inset-0 before:bg-[repeating-linear-gradient(135deg,rgba(255,255,255,0.35)_0,rgba(255,255,255,0.35)_7px,transparent_7px,transparent_14px)]"
              >
                <div
                  class="absolute inset-y-0 left-0 w-full bg-[linear-gradient(90deg,#51c4f2_0%,#7cd8f6_100%)]"
                ></div>
              </div>
              <div class="ml-auto flex items-center gap-[18px]">
                <button
                  class="border-0 bg-transparent text-[0.95rem] font-bold text-[#ef8d32] underline decoration-solid underline-offset-2"
                  type="button"
                >
                  Share link
                </button>
                <button
                  class="border-0 bg-transparent text-[0.95rem] font-bold text-[#ef8d32] underline decoration-solid underline-offset-2"
                  type="button"
                >
                  View file
                </button>
              </div>
              <div
                class="flex h-[28px] w-[28px] items-center justify-center border border-[#a9a9a9] bg-white/20 text-[1.1rem] text-[#5b5b5b]"
              >
                🗂
              </div>
            </div>
          </div>
        </div>

        <div class="mt-7 flex justify-center">
          <div
            id="dropZone"
            class="relative h-[250px] w-[min(78%,610px)] cursor-pointer rounded-[50%_50%_42%_58%/56%_44%_56%_44%] border-[4px] border-dashed border-[#75d9f7] bg-transparent transition duration-200 ease-out hover:border-[#58c2eb] focus:border-[#58c2eb] focus:outline-none"
            tabindex="0"
            role="button"
            aria-label="Upload area"
          >
            <div
              class="absolute inset-0 flex flex-col items-center justify-center"
            >
              <div
                id="dropLabel"
                class="text-[clamp(1.5rem,1.8vw,2.2rem)] font-medium text-[#4d4d4d]"
              >
                3 files selected
              </div>
              <div
                class="my-[10px] text-[clamp(1.3rem,1.5vw,1.8rem)] font-bold text-[#4d4d4d]"
              >
                OR
              </div>
              <button
                id="selectButton"
                class="min-h-[58px] min-w-[230px] rounded-[10px] border-0 bg-[linear-gradient(180deg,#f59b46_0%,#ee8d3e_100%)] px-[26px] text-[clamp(1.5rem,1.8vw,2.1rem)] font-extrabold uppercase tracking-[0.04em] text-white shadow-[0_4px_0_rgba(198,99,24,0.75)]"
                type="button"
              >
                SELECT FILES
              </button>
            </div>
          </div>
        </div>
      </main>
    </div>

    <script>
      const fileInput = document.getElementById("fileInput");
      const dropZone = document.getElementById("dropZone");
      const selectButton = document.getElementById("selectButton");
      const dropLabel = document.getElementById("dropLabel");

      function openPicker() {
        fileInput.click();
      }

      selectButton.addEventListener("click", openPicker);
      dropZone.addEventListener("click", openPicker);
      dropZone.addEventListener("keydown", (event) => {
        if (event.key === "Enter" || event.key === " ") {
          event.preventDefault();
          openPicker();
        }
      });

      fileInput.addEventListener("change", () => {
        const files = fileInput.files;
        if (!files || files.length === 0) {
          dropLabel.textContent = "3 files selected";
          return;
        }
        dropLabel.textContent =
          files.length === 1
            ? "1 file selected"
            : `${files.length} files selected`;
      });

      ["dragenter", "dragover"].forEach((eventName) => {
        dropZone.addEventListener(eventName, (event) => {
          event.preventDefault();
          dropZone.classList.add("drag-over");
        });
      });

      ["dragleave", "drop"].forEach((eventName) => {
        dropZone.addEventListener(eventName, (event) => {
          event.preventDefault();
          dropZone.classList.remove("drag-over");
        });
      });
    </script>
  </body>
</html>
