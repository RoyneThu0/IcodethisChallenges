<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Store Location</title>
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <link href="./output.css" rel="stylesheet" />
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css"
      integrity="sha512-DTOQO9RWCH3ppGqcWaEA1BIZOC6xxalwEsw9c2QQeAIftl+Vegovlnee1c9QX4TctnWMn13TZye+giMm8e2LwA=="
      crossorigin="anonymous"
      referrerpolicy="noreferrer"
    />
  </head>
  <body class="flex min-h-screen items-center justify-center bg-[#1e1a38] p-4">
    <main class="relative min-h-[844px] w-full max-w-[653px] origin-center scale-[0.6]">
        <div
          class="absolute top-0 left-0 h-[533px] w-[calc(100%-71px)] rounded-tr-[48px] rounded-bl-[48px] bg-[linear-gradient(to_bottom_right,#ff5da9,#766aff)]"
        ></div>

        <section
          class="relative ml-auto mt-[97px] w-full max-w-[549px] rounded-[24px] bg-[#121129] px-6 pt-8 pb-8 sm:px-12 sm:pt-12 sm:pb-[49px]"
        >
          <h1 class="mb-8 text-[28px]/[36px] font-semibold text-[#d2cdfb] sm:mb-12 sm:text-[32px]/[42px]">
            Closest stores
          </h1>

          <label
            for="postal"
            class="mb-2 block text-[17px]/[24px] text-[#c3beee]"
          >
            Postal code
          </label>

          <div class="mb-8 flex flex-wrap items-center gap-x-4 gap-y-4 sm:mb-[39px] sm:gap-x-8">
            <input
              id="postal"
              type="text"
              inputmode="numeric"
              value="5055"
              class="h-[71px] w-[191px] rounded-[4px] border-2 border-[#2d2950] bg-transparent px-[18px] text-[24px] text-[#d2cdfb] outline-none focus:border-[#756bff]"
            />
            <button
              type="button"
              class="flex items-center gap-3 text-lg/[28px] font-medium text-[#8477f7] hover:text-[#9f94ff] sm:gap-[21px] sm:text-[24px]/[32px]"
            >
              <i class="fa-solid fa-location-dot text-[28px] sm:text-[32px]"></i>
              <span>Use my location</span>
            </button>
          </div>

          <ul class="space-y-10 sm:space-y-[50px]">
            <li>
              <div class="flex items-center justify-between gap-4">
                <h2 class="text-xl/[28px] font-bold text-[#d2cdfb] sm:text-[24px]/[32px]">
                  POINT Bergen Sentrum
                </h2>
                <span
                  class="shrink-0 rounded-full bg-[#fc5da8] px-[9px] py-[4px] text-sm/[20px] font-bold text-white sm:text-[16px]/[20px]"
                >
                  CLOSED
                </span>
              </div>
              <p class="mt-[13px] text-lg/[28px] text-[#c3beee] sm:text-[24px]/[32px]">
                Strandagaten 55-57, 6007 Bergen
              </p>
              <p
                class="mt-[14px] flex items-center gap-[16px] text-lg/[28px] text-[#c3beee] sm:text-[24px]/[32px]"
              >
                <i class="fa-regular fa-clock text-[22px] sm:text-[26px]"></i>
                <span>9:00 - 19:00</span>
              </p>
            </li>

            <li>
              <div class="flex items-center justify-between gap-4">
                <h2 class="text-xl/[28px] font-bold text-[#d2cdfb] sm:text-[24px]/[32px]">
                  POIVestkanten
                </h2>
                <span
                  class="shrink-0 rounded-full bg-[#06c196] px-[9px] py-[4px] text-sm/[20px] font-bold text-white sm:text-[16px]/[20px]"
                >
                  OPEN
                </span>
              </div>
              <p class="mt-[13px] text-lg/[28px] text-[#c3beee] sm:text-[24px]/[32px]">
                Strandagaten 55-57, 6007 Bergen
              </p>
              <p
                class="mt-[14px] flex items-center gap-[16px] text-lg/[28px] text-[#c3beee] sm:text-[24px]/[32px]"
              >
                <i class="fa-regular fa-clock text-[22px] sm:text-[26px]"></i>
                <span>9:00 - 21:00</span>
              </p>
            </li>
          </ul>

          <button
            type="button"
            class="mt-10 h-[71px] w-full rounded-[6px] bg-[#756bff] text-xl font-semibold text-white hover:bg-[#8278ff] sm:mt-[51px] sm:text-[24px]"
          >
            View all
          </button>
        </section>
    </main>
  </body>
</html>
