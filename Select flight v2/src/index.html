<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Select Flight</title>
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>

    <link href="./output.css" rel="stylesheet" />
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css"
      integrity="sha512DTOQO9RWCH3ppGqcWaEA1BIZOC6xxalwEsw9c2QQeAIftl+Vegovlnee1c9QX4TctnWMn13TZye+giMm8e2LwA=="
      crossorigin="anonymous"
      referrerpolicy="noreferrer"
    />
  </head>

  <body
    class="min-h-screen bg-gradient-to-br from-amber-50 via-orange-50 to-sky-50 px-4 py-8 sm:px-6 lg:px-8"
  >
    <div
      class="max-w-5xl mx-auto bg-white/90 rounded-3xl shadow-2xl shadow-orange-100/60 overflow-hidden backdrop-blur-sm"
    >
      <div
        class="text-center flex flex-col items-center justify-center px-6 py-8 sm:px-10"
      >
        <div
          class="flex items-center justify-center w-14 h-14 rounded-2xl mb-5 bg-amber-100 text-amber-600 shadow-sm"
        >
          <i class="fa-solid fa-plane text-lg"></i>
        </div>
        <div class="flex items-center justify-center gap-3 flex-wrap">
          <h2 class="text-lg sm:text-xl font-semibold text-slate-800">
            Bucharest | OTP
          </h2>
          <span class="text-slate-400">→</span>
          <h2 class="text-lg sm:text-xl font-semibold text-slate-800">
            Tenerife (Canary Islands) | TFS
          </h2>
        </div>
      </div>

      <div
        class="flex items-center justify-between px-4 sm:px-6 overflow-x-auto gap-3 pb-1 pt-2 mb-7"
      >
        <button
          class="w-10 h-10 shrink-0 rounded-full bg-white text-slate-500 flex items-center justify-center shadow-md shadow-slate-100 hover:text-slate-700 hover:shadow-lg transition"
        >
          ←
        </button>

        <div class="flex gap-3 text-center" id="date-options">
          <button
            type="button"
            data-date-chip
            data-date="Tue 30, Apr 2019"
            class="px-4 py-3 bg-slate-100 rounded-xl text-slate-500 min-w-36 transition duration-200 hover:bg-slate-200 focus-visible:outline-none focus-visible:ring-2 focus-visible:ring-amber-300"
          >
            <div class="font-medium">Tue 30, Apr</div>
            <div class="text-sm">No flights</div>
          </button>
          <button
            type="button"
            data-date-chip
            data-date="Wed 01, May 2019"
            class="px-4 py-3 bg-slate-100 rounded-xl text-slate-500 min-w-36 transition duration-200 hover:bg-slate-200 focus-visible:outline-none focus-visible:ring-2 focus-visible:ring-amber-300"
          >
            <div class="font-medium">Wed 01, May</div>
            <div class="text-sm">No flights</div>
          </button>
          <button
            type="button"
            data-date-chip
            data-date="Thu 02, May 2019"
            class="px-4 py-3 rounded-xl bg-amber-100/70 text-slate-900 shadow-md shadow-amber-200/50 min-w-36 ring-2 ring-amber-300 transition duration-200 hover:bg-amber-100 focus-visible:outline-none focus-visible:ring-2 focus-visible:ring-amber-300"
            aria-pressed="true"
          >
            <div class="font-semibold">Thu 02, May</div>
            <div class="text-sm">From <strong>$264</strong></div>
          </button>
          <button
            type="button"
            data-date-chip
            data-date="Fri 03, May 2019"
            class="px-4 py-3 bg-slate-100 rounded-xl text-slate-500 min-w-36 transition duration-200 hover:bg-slate-200 focus-visible:outline-none focus-visible:ring-2 focus-visible:ring-amber-300"
          >
            <div class="font-medium">Fri 03, May</div>
            <div class="text-sm">No flights</div>
          </button>
          <button
            type="button"
            data-date-chip
            data-date="Sat 04, May 2019"
            class="px-4 py-3 rounded-xl bg-white text-slate-800 shadow-md shadow-slate-100 min-w-36 transition duration-200 hover:bg-slate-50 focus-visible:outline-none focus-visible:ring-2 focus-visible:ring-amber-300"
          >
            <div class="font-semibold">Sat 04, May</div>
            <div class="text-sm">From <strong>$254</strong></div>
          </button>
          <button
            type="button"
            data-date-chip
            data-date="Sun 05, May 2019"
            class="px-4 py-3 bg-slate-100 rounded-xl text-slate-500 min-w-36 transition duration-200 hover:bg-slate-200 focus-visible:outline-none focus-visible:ring-2 focus-visible:ring-amber-300"
          >
            <div class="font-medium">Sun 05, May</div>
            <div class="text-sm">No flights</div>
          </button>
        </div>

        <button
          class="w-10 h-10 shrink-0 rounded-full bg-white text-slate-500 flex items-center justify-center shadow-md shadow-slate-100 hover:text-slate-700 hover:shadow-lg transition"
        >
          →
        </button>
      </div>

      <div class="text-center mb-8 px-4 sm:px-6">
        <div
          id="selected-date"
          class="text-sm font-medium text-slate-500 mb-4 tracking-wide uppercase"
        >
          Thu 02, May 2019
        </div>
        <div
          class="flex items-center justify-center gap-3 sm:gap-6 w-fit mx-auto flex-wrap sm:flex-nowrap"
        >
          <h1 class="font-semibold text-center text-slate-800">
            Thu 02, May 2019
            <span class="text-3xl sm:text-4xl leading-tight block">13:40</span>
            <span class="text-xs font-medium text-slate-500 block"
              >Bucharest</span
            >
          </h1>
          <div class="flex items-center gap-3">
            <span class="w-8 sm:w-10 h-px bg-slate-200"></span>
            <p
              class="text-xs text-slate-600 bg-slate-100 px-4 py-2 rounded-full font-medium"
            >
              6h 15 min
            </p>
            <span class="w-8 sm:w-10 h-px bg-slate-200"></span>
          </div>
          <h1 class="font-semibold text-center text-slate-800">
            Thu 02, May 2019
            <span class="text-3xl sm:text-4xl leading-tight block">17:55</span>
            <span class="text-xs font-medium text-slate-500 block"
              >Tenerife (Canary Islands)</span
            >
          </h1>
        </div>
      </div>

      <div class="px-6 pb-8 sm:pb-10 text-center">
        <button
          class="bg-amber-400 text-slate-900 font-bold py-3 px-8 rounded-2xl shadow-lg shadow-amber-200/70 hover:bg-amber-300 hover:-translate-y-0.5 transition"
        >
          SELECT BUNDLE
        </button>
      </div>
    </div>
  </body>
  <script>
    const dateChips = document.querySelectorAll("[data-date-chip]");
    const selectedDate = document.getElementById("selected-date");

    const activeClasses = [
      "bg-amber-100/70",
      "text-slate-900",
      "shadow-md",
      "shadow-amber-200/50",
      "ring-2",
      "ring-amber-300",
    ];
    const inactiveClasses = [
      "bg-slate-100",
      "text-slate-500",
      "bg-white",
      "text-slate-800",
      "shadow-slate-100",
      "hover:bg-slate-200",
      "hover:bg-slate-50",
    ];

    dateChips.forEach((chip) => {
      chip.addEventListener("click", () => {
        dateChips.forEach((item) => {
          item.classList.remove(...activeClasses);
          item.classList.remove("font-semibold");
          item.classList.add(
            "bg-slate-100",
            "text-slate-500",
            "hover:bg-slate-200",
          );
          item.setAttribute("aria-pressed", "false");
        });

        chip.classList.remove(...inactiveClasses);
        chip.classList.add(...activeClasses);
        chip.classList.remove("hover:bg-slate-200", "hover:bg-slate-50");
        chip.setAttribute("aria-pressed", "true");

        if (selectedDate) {
          selectedDate.textContent = chip.dataset.date;
        }
      });
    });
  </script>
</html>
