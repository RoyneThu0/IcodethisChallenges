<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Pricing Components</title>
    <script src="https://cdn.tailwindcss.com"></script>

    <link href="./output.css" rel="stylesheet" />
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css"
      integrity="sha512DTOQO9RWCH3ppGqcWaEA1BIZOC6xxalwEsw9c2QQeAIftl+Vegovlnee1c9QX4TctnWMn13TZye+giMm8e2LwA=="
      crossorigin="anonymous"
      referrerpolicy="noreferrer"
    />
  </head>
  <body
    class="w-full min-h-screen flex items-center justify-center bg-gray-900 px-4 py-8"
  >
    <div
      class="w-full max-w-xl flex flex-col px-2 sm:px-8 lg:max-w-6xl lg:grid lg:grid-cols-2 lg:items-center lg:gap-x-20 lg:gap-y-24"
    >
      <div
        class="flex flex-col p-2 mb-6 items-center sm:p-6 lg:col-start-2 lg:row-start-1 lg:mb-0 lg:p-0"
      >
        <p class="text-white text-center font-semibold font-serif text-xl lg:text-lg">
          What is your use case?
        </p>
        <div
          role="group"
          aria-label="Use case"
          class="grid w-full max-w-2xl grid-cols-1 mt-5 sm:grid-cols-3 lg:mt-7 lg:max-w-[15rem]"
        >
          <button
            type="button"
            aria-pressed="true"
            class="use-case-option relative isolate appearance-none border border-b-0 group hover:bg-white duration-300 ease-in-out p-4 text-center sm:p-5 sm:border-b sm:rounded-l-xl sm:rounded-tr-none rounded-t-xl"
          >
            <p class="font-bold text-white group-hover:text-gray-950">B2C</p>
          </button>
          <button
            type="button"
            aria-pressed="false"
            class="use-case-option relative isolate appearance-none border-x border-b border-t hover:bg-white group duration-300 ease-in-out p-4 text-center sm:p-5 sm:border-x-0 sm:border-y"
          >
            <p class="font-bold text-white group-hover:text-gray-950">B2B</p>
          </button>
          <button
            type="button"
            aria-pressed="false"
            class="use-case-option relative isolate appearance-none hover:bg-white border border-t-0 group duration-300 ease-in-out p-4 text-center sm:p-5 sm:border-t sm:rounded-r-xl sm:rounded-bl-none rounded-b-xl"
          >
            <p class="font-bold text-white group-hover:text-gray-950">B2E</p>
          </button>
        </div>
      </div>
      <div
        class="bg-gradient-to-r from-[#ff784e] to-[#ff8c26] p-6 flex flex-col rounded-2xl sm:p-10 lg:col-start-1 lg:row-start-1 lg:justify-self-center lg:w-full lg:max-w-[22.5rem] lg:p-10"
      >
        <p class="text-white font-serif font-semibold text-2xl">Free plan</p>
        <p class="text-white mt-2">
          Get a free plan with up to 5,000 active users and unlimited logins.
          <br />
          No credit card required.
        </p>
        <button
          class="mt-4 bg-white text-gray-950 font-bold py-4 px-4 rounded hover:bg-gray-200 duration-300 ease-in-out w-full rounded-xl sm:w-40 lg:mt-8 lg:w-44"
        >
          Start for free
        </button>
      </div>
      <div
        class="w-full px-2 py-8 mt-5 sm:p-10 lg:col-span-2 lg:row-start-2 lg:justify-self-center lg:mt-0 lg:max-w-[21.5rem] lg:p-0"
      >
        <p class="font-semibold font-serif text-white text-center text-xl lg:text-lg">
          How many active users?
        </p>
        <div class="mt-8 flex flex-col items-center">
          <style>
            #activeUsers::-webkit-slider-runnable-track {
              height: 0.5rem;
              border-radius: 9999px;
              background: transparent;
            }
            #activeUsers::-webkit-slider-thumb {
              -webkit-appearance: none;
              width: 18px;
              height: 18px;
              border-radius: 9999px;
              background: #fff;
              box-shadow: 0 0 0 4px rgba(255, 255, 255, 0.12);
              cursor: pointer;
              margin-top: -5px;
            }
            #activeUsers::-moz-range-track,
            #activeUsers::-moz-range-progress {
              height: 0.5rem;
              border-radius: 9999px;
              background: transparent;
            }
            #activeUsers::-moz-range-thumb {
              width: 18px;
              height: 18px;
              border-radius: 9999px;
              background: #fff;
              border: none;
              cursor: pointer;
            }
            .use-case-option[aria-pressed="true"] p {
              color: #111827;
            }
            .use-case-option[aria-pressed="true"]::before {
              position: absolute;
              inset: 1px;
              z-index: -1;
              border-radius: inherit;
              background-color: #fff;
              content: "";
            }
          </style>

          <input
            id="activeUsers"
            type="range"
            min="1000"
            max="10000"
            step="1000"
            value="4000"
            class="w-full appearance-none h-2 rounded-full outline-none"
          />
          <div class="relative mt-4 flex w-full justify-between text-white">
            <span class="text-sm">1,000</span>
            <span class="text-sm">10,000</span>
            <output
              id="activeUsersValue"
              for="activeUsers"
              class="absolute top-0 -translate-x-1/2 rounded-xl bg-white px-5 py-3 text-center text-lg font-bold text-gray-950 shadow"
              >4,000</output
            >
          </div>

          <script>
            (function () {
              const slider = document.getElementById("activeUsers");
              const valueDisplay = document.getElementById("activeUsersValue");

              const fmt = (n) => Number(n).toLocaleString();

              function update() {
                const v = Number(slider.value);
                valueDisplay.textContent = fmt(v);

                const min = Number(slider.min || 0);
                const max = Number(slider.max || 100);
                const pct = ((v - min) / (max - min)) * 100;
                slider.style.background = `linear-gradient(90deg,#f97316 ${pct}%, #e5e7eb ${pct}%)`;
                valueDisplay.style.left = `${pct}%`;
              }

              slider.addEventListener("input", update);
              update();
            })();
          </script>
          <script>
            document.querySelectorAll(".use-case-option").forEach((option) => {
              option.addEventListener("click", () => {
                document
                  .querySelectorAll(".use-case-option")
                  .forEach((item) => {
                    const selected = item === option;
                    item.setAttribute("aria-pressed", String(selected));
                    item
                      .querySelector("p")
                      .classList.toggle("text-gray-950", selected);
                  });
              });
            });
          </script>
        </div>
      </div>
    </div>
  </body>
</html>
