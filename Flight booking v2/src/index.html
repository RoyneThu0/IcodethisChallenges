<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Flight Booking</title>
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>

    <link href="./output.css" rel="stylesheet" />
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css"
      integrity="sha512DTOQO9RWCH3ppGqcWaEA1BIZOC6xxalwEsw9c2QQeAIftl+Vegovlnee1c9QX4TctnWMn13TZye+giMm8e2LwA=="
      crossorigin="anonymous"
      referrerpolicy="noreferrer"
    />
  </head>

  <body
    class="min-h-screen flex items-center bg-cover bg-center justify-center p-3"
    style="
      background-image: url(https://images.unsplash.com/photo-1436491865332-7a61a109cc05?w=900&auto=format&fit=crop&q=60&ixlib=rb-4.1.0&ixid=M3wxMjA3fDB8MHxzZWFyY2h8Mnx8cGxhbmV8ZW58MHwwfDB8fHww);
    "
  >
    <div
      class="w-[92%] max-w-3xl md:p-6 p-3 shadow-xl flex flex-col justify-center bg-white/60 hover:bg-white duration-500 transition-all ease-in-out rounded-lg"
    >
      <div class="w-full flex items-end justify-start gap-3">
        <p
          class="text-lg text-gray-400 duration-300 ease-in-out hover:text-black hover:underline underline-offset-8 font-semibold"
        >
          FLIGHTS
        </p>
        <p
          class="text-lg text-gray-400 duration-300 ease-in-out hover:text-black hover:underline underline-offset-8 font-semibold"
        >
          HOTELS
        </p>
        <p
          class="text-lg text-gray-400 duration-300 ease-in-out hover:text-black hover:underline underline-offset-8 font-semibold"
        >
          CARS
        </p>
      </div>
      <div
        class="w-full mt-3 bg-gray-100/60 hover:bg-gray-100 duration-500 shadow-inner rounded-lg p-5 flex items-start"
      >
        <div class="w-1/6 hidden md:block">
          <img
            src="https://www.shareicon.net/data/2016/04/20/752388_arrows_512x512.png"
            alt=""
          />
        </div>
        <div class="md:w-5/6 w-full p-2">
          <form class="space-y-3">
            <div
              class="rounded-md border border-gray-200 bg-white px-3 py-2 shadow-sm"
            >
              <label class="block text-sm font-semibold text-gray-600"
                >Origin</label
              >
              <input
                class="mt-1 w-full bg-transparent text-lg font-light text-gray-800 outline-none"
                value="Bucharest | (OTP)"
              />
            </div>
            <div
              class="rounded-md border border-gray-200 bg-white px-3 py-2 shadow-sm"
            >
              <label class="block text-sm font-semibold text-gray-600"
                >Destination</label
              >
              <input
                class="mt-1 w-full bg-transparent text-lg font-light text-gray-800 outline-none"
                value="Tenerife (Canary Islands) | (TFS)"
              />
            </div>
            <div class="grid md:grid-cols-3 grid-cols-1 gap-3">
              <div
                class="rounded-md border border-gray-200 bg-white px-3 py-2 shadow-sm"
              >
                <label class="block text-sm font-semibold text-gray-600"
                  >Departure</label
                >
                <input
                  type="date"
                  class="mt-1 w-full bg-transparent text-lg font-light text-gray-800 outline-none"
                  value="2018-03-26"
                />
              </div>
              <div
                class="rounded-md border border-gray-200 bg-white px-3 py-2 shadow-sm"
              >
                <label class="block text-sm font-semibold text-gray-600"
                  >Arrival</label
                >
                <input
                  type="date"
                  class="mt-1 w-full bg-transparent text-lg font-light text-gray-800 outline-none"
                  value="2018-03-26"
                />
              </div>
              <div
                class="rounded-md border border-gray-200 bg-white px-3 py-2 shadow-sm"
              >
                <label class="block text-sm font-semibold text-gray-600"
                  >Passengers</label
                >
                <select
                  class="mt-1 w-full bg-transparent text-lg font-light text-gray-800 outline-none"
                >
                  <option>3 Adults</option>
                  <option>2 Adults</option>
                  <option>1 Adult</option>
                  <option>Very Adulty Adult</option>
                  <option>a Tiny Adult</option>
                </select>
              </div>
            </div>
          </form>
          <div class="mt-4">
            <button
              class="w-full bg-purple-500/70 text-white py-4 text-lg rounded-md hover:bg-purple-600 shadow-lg transition duration-200"
            >
              SEARCH
            </button>
          </div>
          <p
            class="text-base italic hover:text-blue-500 active:bg-purple-500 cursor-pointer hover:underline mt-3"
          >
            Flexible on Dates?
          </p>
        </div>
      </div>
    </div>
  </body>
</html>
