<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Pagination UI</title>
    <script src="https://cdn.tailwindcss.com"></script>

    <link href="./output.css" rel="stylesheet" />
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css"
      integrity="sha512DTOQO9RWCH3ppGqcWaEA1BIZOC6xxalwEsw9c2QQeAIftl+Vegovlnee1c9QX4TctnWMn13TZye+giMm8e2LwA=="
      crossorigin="anonymous"
      referrerpolicy="noreferrer"
    />
  </head>
  <body
    class="flex flex-col items-center justify-center w-screen min-h-screen bg-gray-100 space-y-10"
  >
    <div
      role="radiogroup"
      aria-label="Pagination, pages 1 to 5"
      class="w-11/12 max-w-md bg-white shadow-lg shadow-teal-300/20 flex items-center justify-center p-1.5 space-x-5 text-sm text-gray-400"
    >
      <button class="text-xl hover:text-gray-600 transition">
        <i class="fa-solid fa-arrow-left"></i>
      </button>
      <label class="w-7 h-7 rounded-full flex items-center justify-center cursor-pointer transition has-[:checked]:bg-teal-200 has-[:checked]:text-white has-[:checked]:font-semibold focus-within:ring-2 focus-within:ring-teal-300">
        <input class="sr-only" type="radio" name="pagination-1" value="1" aria-label="Page 1" checked />
        <span>1</span>
      </label>
      <label class="w-7 h-7 rounded-full flex items-center justify-center cursor-pointer transition hover:text-gray-700 has-[:checked]:bg-teal-200 has-[:checked]:text-white has-[:checked]:font-semibold focus-within:ring-2 focus-within:ring-teal-300">
        <input class="sr-only" type="radio" name="pagination-1" value="2" aria-label="Page 2" />
        <span>2</span>
      </label>
      <label class="w-7 h-7 rounded-full flex items-center justify-center cursor-pointer transition hover:text-gray-700 has-[:checked]:bg-teal-200 has-[:checked]:text-white has-[:checked]:font-semibold focus-within:ring-2 focus-within:ring-teal-300">
        <input class="sr-only" type="radio" name="pagination-1" value="3" aria-label="Page 3" />
        <span>3</span>
      </label>
      <label class="w-7 h-7 rounded-full flex items-center justify-center cursor-pointer transition hover:text-gray-700 has-[:checked]:bg-teal-200 has-[:checked]:text-white has-[:checked]:font-semibold focus-within:ring-2 focus-within:ring-teal-300">
        <input class="sr-only" type="radio" name="pagination-1" value="4" aria-label="Page 4" />
        <span>4</span>
      </label>
      <label class="w-7 h-7 rounded-full flex items-center justify-center cursor-pointer transition hover:text-gray-700 has-[:checked]:bg-teal-200 has-[:checked]:text-white has-[:checked]:font-semibold focus-within:ring-2 focus-within:ring-teal-300">
        <input class="sr-only" type="radio" name="pagination-1" value="5" aria-label="Page 5" />
        <span>5</span>
      </label>
      <button class="text-xl text-teal-200 hover:text-gray-600 transition">
        <i class="fa-solid fa-arrow-right"></i>
      </button>
    </div>

    <div
      role="radiogroup"
      aria-label="Pagination, pages 1 to 5 and 9"
      class="w-11/12 max-w-md bg-white shadow-lg shadow-teal-300/20 flex items-center justify-center p-1.5 space-x-5 text-sm text-gray-400"
    >
      <button class="text-xl hover:text-gray-600 transition">
        <i class="fa-solid fa-arrow-left"></i>
      </button>
      <label class="w-7 h-7 rounded-full flex items-center justify-center cursor-pointer transition has-[:checked]:bg-teal-200 has-[:checked]:text-white has-[:checked]:font-semibold focus-within:ring-2 focus-within:ring-teal-300">
        <input class="sr-only" type="radio" name="pagination-2" value="1" aria-label="Page 1" checked />
        <span>1</span>
      </label>
      <label class="w-7 h-7 rounded-full flex items-center justify-center cursor-pointer transition hover:text-gray-700 has-[:checked]:bg-teal-200 has-[:checked]:text-white has-[:checked]:font-semibold focus-within:ring-2 focus-within:ring-teal-300">
        <input class="sr-only" type="radio" name="pagination-2" value="2" aria-label="Page 2" />
        <span>2</span>
      </label>
      <label class="w-7 h-7 rounded-full flex items-center justify-center cursor-pointer transition hover:text-gray-700 has-[:checked]:bg-teal-200 has-[:checked]:text-white has-[:checked]:font-semibold focus-within:ring-2 focus-within:ring-teal-300">
        <input class="sr-only" type="radio" name="pagination-2" value="3" aria-label="Page 3" />
        <span>3</span>
      </label>
      <label class="w-7 h-7 rounded-full flex items-center justify-center cursor-pointer transition hover:text-gray-700 has-[:checked]:bg-teal-200 has-[:checked]:text-white has-[:checked]:font-semibold focus-within:ring-2 focus-within:ring-teal-300">
        <input class="sr-only" type="radio" name="pagination-2" value="4" aria-label="Page 4" />
        <span>4</span>
      </label>
      <label class="w-7 h-7 rounded-full flex items-center justify-center cursor-pointer transition hover:text-gray-700 has-[:checked]:bg-teal-200 has-[:checked]:text-white has-[:checked]:font-semibold focus-within:ring-2 focus-within:ring-teal-300">
        <input class="sr-only" type="radio" name="pagination-2" value="5" aria-label="Page 5" />
        <span>5</span>
      </label>
      <span><i class="fa-solid fa-ellipsis"></i></span>
      <label class="w-7 h-7 rounded-full flex items-center justify-center cursor-pointer transition hover:text-gray-700 has-[:checked]:bg-teal-200 has-[:checked]:text-white has-[:checked]:font-semibold focus-within:ring-2 focus-within:ring-teal-300">
        <input class="sr-only" type="radio" name="pagination-2" value="9" aria-label="Page 9" />
        <span>9</span>
      </label>
      <button class="text-xl text-teal-200 hover:text-gray-600 transition">
        <i class="fa-solid fa-arrow-right"></i>
      </button>
    </div>

    <div
      role="radiogroup"
      aria-label="Pagination, pages 1 to 5 and 9"
      class="w-11/12 max-w-md bg-white shadow-lg shadow-teal-300/20 flex items-center justify-center p-1.5 space-x-5 text-sm text-gray-400"
    >
      <button class="text-xl text-teal-200 hover:text-gray-600 transition">
        <i class="fa-solid fa-arrow-left"></i>
      </button>
      <label class="w-7 h-7 rounded-full flex items-center justify-center cursor-pointer transition hover:text-gray-700 has-[:checked]:bg-teal-200 has-[:checked]:text-white has-[:checked]:font-semibold focus-within:ring-2 focus-within:ring-teal-300">
        <input class="sr-only" type="radio" name="pagination-3" value="1" aria-label="Page 1" />
        <span>1</span>
      </label>
      <label class="w-7 h-7 rounded-full flex items-center justify-center cursor-pointer transition hover:text-gray-700 has-[:checked]:bg-teal-200 has-[:checked]:text-white has-[:checked]:font-semibold focus-within:ring-2 focus-within:ring-teal-300">
        <input class="sr-only" type="radio" name="pagination-3" value="2" aria-label="Page 2" />
        <span>2</span>
      </label>
      <label class="w-7 h-7 rounded-full flex items-center justify-center cursor-pointer transition hover:text-gray-700 has-[:checked]:bg-teal-200 has-[:checked]:text-white has-[:checked]:font-semibold focus-within:ring-2 focus-within:ring-teal-300">
        <input class="sr-only" type="radio" name="pagination-3" value="3" aria-label="Page 3" />
        <span>3</span>
      </label>
      <label class="w-7 h-7 rounded-full flex items-center justify-center cursor-pointer transition has-[:checked]:bg-teal-200 has-[:checked]:text-white has-[:checked]:font-semibold focus-within:ring-2 focus-within:ring-teal-300">
        <input class="sr-only" type="radio" name="pagination-3" value="4" aria-label="Page 4" checked />
        <span>4</span>
      </label>
      <label class="w-7 h-7 rounded-full flex items-center justify-center cursor-pointer transition hover:text-gray-700 has-[:checked]:bg-teal-200 has-[:checked]:text-white has-[:checked]:font-semibold focus-within:ring-2 focus-within:ring-teal-300">
        <input class="sr-only" type="radio" name="pagination-3" value="5" aria-label="Page 5" />
        <span>5</span>
      </label>
      <span><i class="fa-solid fa-ellipsis"></i></span>
      <label class="w-7 h-7 rounded-full flex items-center justify-center cursor-pointer transition hover:text-gray-700 has-[:checked]:bg-teal-200 has-[:checked]:text-white has-[:checked]:font-semibold focus-within:ring-2 focus-within:ring-teal-300">
        <input class="sr-only" type="radio" name="pagination-3" value="9" aria-label="Page 9" />
        <span>9</span>
      </label>
      <button class="text-xl text-teal-200 hover:text-gray-600 transition">
        <i class="fa-solid fa-arrow-right"></i>
      </button>
    </div>
  </body>
</html>
