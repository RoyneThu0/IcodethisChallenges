<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Halloween</title>
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <link href="./output.css" rel="stylesheet" />
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css"
      integrity="sha512-DTOQO9RWCH3ppGqcWaEA1BIZOC6xxalwEsw9c2QQeAIftl+Vegovlnee1c9QX4TctnWMn13TZye+giMm8e2LwA=="
      crossorigin="anonymous"
      referrerpolicy="no-referrer"
    />
    <style>
      .witch {
        mask-image:
          radial-gradient(
            circle closest-side at 49.7% 49.7%,
            #000 88%,
            transparent 88.5%
          ),
          url("https://api.iconify.design/game-icons/witch-flight.svg");
        mask-composite: subtract;
        mask-size: 100% 100%;
        mask-repeat: no-repeat;
      }
    </style>
  </head>
  <body
    class="min-h-screen bg-[#242c60] bg-linear-to-br from-[#2a3270] via-[#212958] to-[#2c3270] px-4 py-10 antialiased md:flex md:items-center md:py-16"
  >
    <main
      class="mx-auto grid w-full max-w-162 grid-cols-1 gap-5 sm:grid-cols-2 md:grid-cols-[7fr_12fr] md:items-start"
    >
      <div class="contents md:flex md:flex-col">
        <a
          href="#"
          class="group relative isolate order-1 flex h-14.5 items-center justify-center overflow-hidden rounded-md bg-linear-to-br from-[#2e3ba8] via-[#2a3392] to-[#2d368f] text-lg font-bold text-white shadow-xl shadow-[#0c1240]/50 transition hover:-translate-y-0.5 hover:shadow-2xl md:order-none"
        >
          <i
            class="fa-solid fa-cloud absolute -bottom-3 -left-2 -z-10 text-5xl text-[#4b4fb2]/45"
          ></i>
          <i
            class="fa-solid fa-cloud absolute -bottom-4 left-1/3 -z-10 text-4xl text-[#4b4fb2]/40"
          ></i>
          <i
            class="fa-solid fa-cloud absolute -bottom-3.5 right-5 -z-10 text-4xl text-[#4b4fb2]/45"
          ></i>
          <span
            class="absolute left-4 top-5 size-0.5 rounded-full bg-white/70"
          ></span>
          <span
            class="absolute left-1/3 top-3 size-0.5 rounded-full bg-white/50"
          ></span>
          <span
            class="absolute bottom-4 left-1/4 size-0.5 rounded-full bg-white/60"
          ></span>
          <span
            class="absolute right-1/3 top-2 size-0.5 rounded-full bg-white/60"
          ></span>
          <span
            class="absolute bottom-3 right-2/5 size-0.5 rounded-full bg-white/50"
          ></span>
          <span
            class="absolute right-2 top-4 size-0.5 rounded-full bg-white/60"
          ></span>

          LOG IN

          <span class="absolute right-4 top-1/2 -translate-y-1/2">
            <i
              class="fa-solid fa-moon block -scale-x-100 bg-linear-to-b from-[#ffd447] to-[#f39a2c] bg-clip-text text-3xl text-transparent transition group-hover:rotate-12"
            ></i>
            <i
              class="fa-solid fa-cloud absolute -bottom-1 -left-2 text-base text-[#5b5cb6]/70"
            ></i>
          </span>
        </a>

        <a
          href="#"
          class="group relative isolate order-2 flex h-14.5 items-center justify-center overflow-hidden rounded-md bg-white text-lg font-bold text-[#2d3132] shadow-xl shadow-[#0c1240]/50 transition hover:-translate-y-0.5 hover:shadow-2xl md:order-none md:mt-5"
        >
          <img
            src="https://api.iconify.design/emojione-monotone/spider-web.svg?color=%23e7eafa"
            alt=""
            class="absolute -left-12 top-1/2 -z-10 size-24 -translate-y-1/2"
          />
          <i
            class="fa-solid fa-spider absolute left-6 top-9.5 text-xs text-[#7d3207] transition group-hover:translate-y-0.5"
          ></i>

          SUBSCRIBE

          <img
            src="https://api.iconify.design/fluent-emoji-flat/jack-o-lantern.svg"
            alt=""
            class="absolute right-2.5 top-1/2 size-7 -translate-y-1/2 transition group-hover:-rotate-12"
          />
        </a>

        <a href="#" class="group order-5 block md:order-none md:mt-6.5">
          <img
            src="https://images.unsplash.com/photo-1762053275420-bf4653ea2612?w=640&q=80&auto=format&fit=crop"
            alt="Orange and black Halloween decorations hanging in a window"
            class="aspect-15/8 w-full object-cover shadow-xl shadow-[#0c1240]/60 transition group-hover:brightness-110"
          />
          <h3
            class="mt-2.5 text-base/4.75 font-semibold text-balance text-white group-hover:underline md:max-w-40"
          >
            Decorate your home for Halloween
          </h3>
        </a>

        <hr class="hidden border-white/80 md:mt-3 md:block" />

        <a href="#" class="group order-6 block md:order-none md:mt-5">
          <img
            src="https://images.unsplash.com/photo-1698961676332-7ff9b6c5ceed?w=640&q=80&auto=format&fit=crop"
            alt="Woman in a Halloween costume holding a carved pumpkin"
            class="aspect-15/8 w-full object-cover shadow-xl shadow-[#0c1240]/60 transition group-hover:brightness-110"
          />
          <h3
            class="mt-2.5 text-base/4.75 font-semibold text-balance text-white group-hover:underline md:max-w-40"
          >
            DIY Halloween costumes
          </h3>
        </a>
      </div>

      <div class="contents md:mt-5 md:flex md:flex-col md:gap-5">
        <article
          class="group order-3 overflow-hidden rounded-md bg-white shadow-xl shadow-[#0c1240]/60 sm:col-span-2 md:order-none"
        >
          <a href="#" class="block">
            <img
              src="https://images.unsplash.com/photo-1477659803863-c1bf91b34c90?w=900&q=80&auto=format&fit=crop"
              alt="A pumpkin among lit candles on dark, tangled ground"
              class="aspect-33/20 w-full object-cover transition duration-500 group-hover:scale-105"
            />
          </a>
          <div
            class="relative isolate flex gap-6 overflow-hidden px-6 pt-5.5 pb-4.5"
          >
            <img
              src="https://api.iconify.design/emojione-monotone/spider-web.svg?color=%23e7eafa"
              alt=""
              class="absolute -right-19.5 top-1/2 -z-10 size-43 -translate-y-1/2"
            />
            <i
              class="fa-solid fa-spider absolute bottom-5 right-9.5 text-lg text-[#7d3207]"
            ></i>

            <p class="shrink-0 text-center font-semibold text-[#2a3388]">
              <span class="block text-3xl/6.5">31</span>
              <span class="block text-xl/6">Oct</span>
            </p>
            <div>
              <h2
                class="text-base/5 font-semibold uppercase text-[#2d3132] group-hover:text-[#2a3388]"
              >
                <a href="#">The 5 best movies to watch on Halloween</a>
              </h2>
              <p class="mt-0.5 text-base/6 text-[#808c93]">
                by <span class="font-semibold">Nora Johnson</span>
              </p>
            </div>
          </div>
        </article>

        <a
          href="#"
          class="group relative isolate order-4 flex h-16 items-center overflow-hidden rounded-md bg-linear-to-r from-[#2c37a0] via-[#2a3392] via-55% to-[#4a4790] px-6 text-lg font-bold text-white shadow-xl shadow-[#0c1240]/50 transition hover:-translate-y-0.5 hover:shadow-2xl sm:col-span-2 md:order-none"
        >
          <i
            class="fa-solid fa-cloud absolute -bottom-4 left-24 -z-10 text-5xl text-[#4b4fb2]/45"
          ></i>
          <i
            class="fa-solid fa-cloud absolute -bottom-3.5 left-1/2 -z-10 text-4xl text-[#4b4fb2]/40"
          ></i>
          <span
            class="absolute left-5 bottom-3 size-0.5 rounded-full bg-white/60"
          ></span>
          <span
            class="absolute left-28 top-3 size-0.5 rounded-full bg-white/60"
          ></span>
          <span
            class="absolute left-1/2 top-6 size-0.5 rounded-full bg-white/50"
          ></span>
          <span
            class="absolute bottom-5 left-3/5 size-0.5 rounded-full bg-white/60"
          ></span>

          CATEGORIES

          <span
            class="absolute -right-6 -top-6 -z-10 size-48 rounded-full bg-[#c97b5c]/45 blur-2xl"
          ></span>
          <span
            class="absolute right-2 top-2.5 size-32 rounded-full bg-linear-to-br from-[#ffbc39] via-[#fdb03b] to-[#f99c3d]"
          >
            <span
              class="absolute left-6 top-14 size-3 rounded-full bg-[#f6982f]/40"
            ></span>
            <span
              class="absolute right-8 top-8 size-2 rounded-full bg-[#f6982f]/40"
            ></span>
            <span
              class="absolute right-5 top-16 size-4 rounded-full bg-[#f6982f]/30"
            ></span>
            <span
              class="witch absolute left-7 top-1 size-9 bg-[#823007] transition duration-700 group-hover:-translate-x-2 group-hover:-translate-y-1"
            ></span>
          </span>
        </a>
      </div>
    </main>
  </body>
</html>
