<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Wallet balance</title>
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <link href="./output.css" rel="stylesheet" />
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css"
      integrity="sha512-DTOQO9RWCH3ppGqcWaEA1BIZOC6xxalwEsw9c2QQeAIftl+Vegovlnee1c9QX4TctnWMn13TZye+giMm8e2LwA=="
      crossorigin="anonymous"
      referrerpolicy="no-referrer"
    />
  </head>

  <body class="bg-gray-100 min-h-screen flex items-center justify-center p-6">
    <div
      class="w-full max-w-md bg-white rounded-2xl shadow-2xl overflow-hidden"
    >
      <div
        class="relative bg-linear-to-br from-sky-300 via-indigo-300 to-purple-400 text-white px-6 pt-6"
      >
        <div class="flex items-center justify-between">
          <button class="text-white text-xl p-2">
            <i class="fa-solid fa-bars"></i>
          </button>
          <nav class="hidden sm:flex gap-6 text-sm opacity-90">
            <a href="#" class="font-medium">Summary</a>
            <a href="#" class="opacity-80">Activity</a>
            <a href="#" class="opacity-80">Send/request</a>
          </nav>
          <div class="w-8"></div>
        </div>

        <div class="text-center mt-6">
          <div class="uppercase text-xs tracking-widest opacity-90">
            Your balance
          </div>
          <div class="mt-2 text-5xl sm:text-6xl font-extrabold tracking-tight">
            244.53
            <span class="text-2xl font-medium align-text-top">USD</span>
          </div>
        </div>

        <div class="relative -mx-6 mt-4 h-24">
          <svg
            viewBox="0 0 800 160"
            preserveAspectRatio="none"
            class="absolute inset-x-0 -bottom-px h-full w-full pointer-events-none"
          >
            <path
              d="M0,68 C39,49 95,20 188,20 C375,20 420,138 605,138 C671,138 750,123 800,95 L800,160 L0,160 Z"
              class="fill-white"
            />
          </svg>

          <div
            class="relative grid h-full grid-cols-2 items-center px-6 pb-2.5 text-center"
          >
            <button class="uppercase tracking-wide text-gray-500">
              Pending
            </button>
            <button class="uppercase tracking-wide text-white">
              Completed
            </button>
          </div>
        </div>
      </div>

      <div class="p-6 pt-4">
        <div class="space-y-5">
          <div class="border border-transparent rounded-lg">
            <div class="text-gray-800 font-semibold">Company Inc.</div>
            <div class="text-sm text-gray-600 mt-1">
              Payment request for
              <span class="font-medium">280.00 CAD</span> sent
            </div>
            <div class="text-xs text-gray-400 mt-2">
              Company Inc. hasn't paid yet
            </div>
            <div class="mt-4 flex flex-wrap gap-3">
              <button
                class="px-4 py-2 rounded-full border-2 border-purple-300 text-purple-700 text-sm hover:bg-purple-50"
              >
                Send a reminder
              </button>
              <button
                class="px-4 py-2 rounded-full border-2 border-purple-300 text-purple-700 text-sm hover:bg-purple-50"
              >
                Edit amount
              </button>
              <button
                class="px-4 py-2 rounded-full border-2 border-purple-300 text-purple-700 text-sm hover:bg-purple-50"
              >
                Cancel
              </button>
            </div>
          </div>

          <div class="border border-transparent rounded-lg">
            <div class="text-gray-800 font-semibold">Company Inc.</div>
            <div class="text-sm text-gray-600 mt-1">
              Payment request for
              <span class="font-medium">356.00 USD</span> sent
            </div>
            <div class="text-xs text-gray-400 mt-2">
              Company Inc. hasn't paid yet
            </div>
            <div class="mt-4 flex flex-wrap gap-3">
              <button
                class="px-4 py-2 rounded-full border-2 border-purple-300 text-purple-700 text-sm hover:bg-purple-50"
              >
                Send a reminder
              </button>
              <button
                class="px-4 py-2 rounded-full border-2 border-purple-300 text-purple-700 text-sm hover:bg-purple-50"
              >
                Edit amount
              </button>
              <button
                class="px-4 py-2 rounded-full border-2 border-purple-300 text-purple-700 text-sm hover:bg-purple-50"
              >
                Cancel
              </button>
            </div>
          </div>

          <div class="border border-transparent rounded-lg">
            <div class="text-gray-800 font-semibold">Company Inc.</div>
            <div class="text-sm text-gray-600 mt-1">
              Payment request for
              <span class="font-medium">677.00 USD</span> sent
            </div>
            <div class="text-xs text-gray-400 mt-2">
              Company Inc. hasn't paid yet
            </div>
            <div class="mt-4 flex flex-wrap gap-3">
              <button
                class="px-4 py-2 rounded-full border-2 border-purple-300 text-purple-700 text-sm hover:bg-purple-50"
              >
                Send a reminder
              </button>
              <button
                class="px-4 py-2 rounded-full border-2 border-purple-300 text-purple-700 text-sm hover:bg-purple-50"
              >
                Edit amount
              </button>
              <button
                class="px-4 py-2 rounded-full border-2 border-purple-300 text-purple-700 text-sm hover:bg-purple-50"
              >
                Cancel
              </button>
            </div>
          </div>
        </div>
      </div>
    </div>
  </body>
</html>
