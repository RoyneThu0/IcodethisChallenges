<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Verification code</title>
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>

    <link href="./output.css" rel="stylesheet" />
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css"
      integrity="sha512-DTOQO9RWCH3ppGqcWaEA1BIZOC6xxalwEsw9c2QQeAIftl+Vegovlnee1c9QX4TctnWMn13TZye+giMm8e2LwA=="
      crossorigin="anonymous"
      referrerpolicy="noreferrer"
    />

    <style>
      @keyframes shake {
        10%,
        90% {
          transform: translateX(-2px);
        }
        20%,
        80% {
          transform: translateX(4px);
        }
        30%,
        50%,
        70% {
          transform: translateX(-6px);
        }
        40%,
        60% {
          transform: translateX(6px);
        }
      }
      .shake {
        animation: shake 0.4s cubic-bezier(0.36, 0.07, 0.19, 0.97) both;
      }
      @keyframes pop {
        from {
          opacity: 0;
          transform: translateY(6px) scale(0.9);
        }
        to {
          opacity: 1;
          transform: none;
        }
      }
      .pop {
        animation: pop 0.35s cubic-bezier(0.34, 1.56, 0.64, 1) both;
      }
    </style>
  </head>
  <body
    class="bg-[#e6e9f5] flex items-center justify-center min-h-screen gap-12 bg-cover bg-center"
    style="background-image: url(https://wallpapercave.com/wp/wp6991861.jpg)"
  >
    <div
      id="firstDiv"
      class="bg-gradient-to-br from-[#1f254d]/60 to-[#1b1f3a]/60 backdrop-blur-lg p-8 rounded-2xl w-80 shadow-lg text-white"
    >
      <button
        id="backBtn"
        type="button"
        aria-label="Back"
        title="Clear the code"
        class="mb-4 text-gray-300 transition hover:text-white focus:outline-none focus-visible:ring-2 focus-visible:ring-purple-400 rounded"
      >
        <i class="fa-solid fa-arrow-left fa-fw"></i>
      </button>
      <h2 class="text-lg font-semibold">Confirmation</h2>
      <p class="text-sm text-gray-400 mt-1">
        Please enter the code we sent to the number ********78
      </p>

      <div id="otpRow" class="flex gap-3 mt-6">
        <input
          type="text"
          maxlength="1"
          inputmode="numeric"
          autocomplete="one-time-code"
          aria-label="Digit 1"
          class="otp w-12 h-12 text-xl text-center rounded-md border border-gray-600 bg-transparent transition focus:outline-none focus:ring-2 focus:ring-purple-400 disabled:opacity-50"
        />
        <input
          type="text"
          maxlength="1"
          inputmode="numeric"
          aria-label="Digit 2"
          class="otp w-12 h-12 text-xl text-center rounded-md border border-gray-600 bg-transparent transition focus:outline-none focus:ring-2 focus:ring-purple-400 disabled:opacity-50"
        />
        <input
          type="text"
          maxlength="1"
          inputmode="numeric"
          aria-label="Digit 3"
          class="otp w-12 h-12 text-xl text-center rounded-md border border-gray-600 bg-transparent transition focus:outline-none focus:ring-2 focus:ring-purple-400 disabled:opacity-50"
        />
        <input
          type="text"
          maxlength="1"
          inputmode="numeric"
          aria-label="Digit 4"
          class="otp w-12 h-12 text-xl text-center rounded-md border border-gray-600 bg-transparent transition focus:outline-none focus:ring-2 focus:ring-purple-400 disabled:opacity-50"
        />
      </div>

      <p
        id="status"
        role="status"
        aria-live="polite"
        class="mt-3 h-4 text-xs text-gray-400"
      ></p>

      <button
        id="resendBtn"
        type="button"
        class="mt-1 text-xs text-purple-300 transition hover:text-purple-200"
      >
        RESEND CODE
      </button>

      <button
        id="continueBtn"
        type="button"
        class="w-full mt-6 py-3 rounded-lg bg-gradient-to-r from-purple-400 to-pink-500 font-semibold transition hover:brightness-110 active:scale-[0.98] disabled:opacity-50 disabled:hover:brightness-100 disabled:active:scale-100 disabled:cursor-not-allowed"
      >
        Confirm
      </button>
    </div>

    <div
      id="modal"
      class="fixed inset-0 z-50 hidden items-center justify-center bg-[#141833]/60 p-4 opacity-0 backdrop-blur-sm transition-opacity duration-200"
    >
      <div
        id="secondDiv"
        role="dialog"
        aria-modal="true"
        aria-labelledby="modalTitle"
        class="hidden bg-white/60 backdrop-blur-lg p-8 rounded-2xl w-80 shadow-lg text-center relative scale-95 opacity-0 transition-all duration-200"
      >
        <button
          id="closeIconBtn"
          type="button"
          aria-label="Close"
          class="absolute top-4 right-4 text-gray-400 transition hover:text-gray-600 focus:outline-none focus-visible:ring-2 focus-visible:ring-blue-400 rounded"
        >
          <i class="fa-solid fa-xmark fa-fw"></i>
        </button>

        <h2 id="modalTitle" class="text-lg font-semibold">Verification Code</h2>
        <p class="text-sm text-gray-500 mt-1">
          Enter this verification code on your other device to sign in.
        </p>

        <div
          id="codeOut"
          class="flex justify-center gap-4 mt-6 text-2xl font-bold tracking-wider"
        >
          <span class="px-3 py-2 bg-gray-100/60 rounded">5</span>
          <span class="px-3 py-2 bg-gray-100/60 rounded">8</span>
          <span class="px-3 py-2 bg-gray-100/60 rounded">3</span>
          <span class="px-3 py-2 bg-gray-100/60 rounded">1</span>
        </div>

        <button
          id="closeTextBtn"
          type="button"
          class="mt-6 text-sm text-blue-500 transition hover:text-blue-600"
        >
          CLOSE
        </button>
      </div>

      <div
        id="successDiv"
        role="dialog"
        aria-modal="true"
        aria-labelledby="successTitle"
        class="hidden bg-white/60 backdrop-blur-lg p-8 rounded-2xl w-80 shadow-lg text-center relative scale-95 opacity-0 transition-all duration-200"
      >
        <button
          id="successCloseIconBtn"
          type="button"
          aria-label="Close"
          class="absolute top-4 right-4 text-gray-400 transition hover:text-gray-600 focus:outline-none focus-visible:ring-2 focus-visible:ring-blue-400 rounded"
        >
          <i class="fa-solid fa-xmark fa-fw"></i>
        </button>

        <div
          id="successIcon"
          class="mx-auto flex h-16 w-16 items-center justify-center rounded-full bg-emerald-500/20 text-2xl text-emerald-600"
        >
          <i class="fa-solid fa-check fa-fw"></i>
        </div>

        <h2 id="successTitle" class="text-lg font-semibold mt-4">
          Number Verified
        </h2>
        <p class="text-sm text-gray-500 mt-1">
          The code matched. Your number ********78 is confirmed and you are
          signed in.
        </p>

        <button
          id="doneBtn"
          type="button"
          class="mt-6 text-sm text-blue-500 transition hover:text-blue-600"
        >
          DONE
        </button>
      </div>
    </div>

    <script>
      const inputs = Array.from(document.querySelectorAll(".otp"));
      const otpRow = document.getElementById("otpRow");
      const status = document.getElementById("status");
      const continueBtn = document.getElementById("continueBtn");
      const resendBtn = document.getElementById("resendBtn");
      const backBtn = document.getElementById("backBtn");
      const modal = document.getElementById("modal");
      const codeOut = document.getElementById("codeOut");
      const digits = Array.from(codeOut.children);
      const successIcon = document.getElementById("successIcon");

      const cards = {
        code: document.getElementById("secondDiv"),
        success: document.getElementById("successDiv"),
      };
      const closers = {
        code: document.getElementById("closeIconBtn"),
        success: document.getElementById("successCloseIconBtn"),
      };

      // The code the page has "sent" — 5831 first, then a fresh one on resend.
      let sentCode = "5831";
      let revealed = false;
      let verifying = false;
      let openView = null;

      const typedCode = () => inputs.map((i) => i.value).join("");
      const isComplete = () => typedCode().length === inputs.length;

      function nextCode() {
        let code = sentCode;
        while (code === sentCode) {
          code = String(Math.floor(1000 + Math.random() * 9000));
        }
        return code;
      }

      function setStatus(message, tone) {
        status.textContent = message || "";
        status.className =
          "mt-3 h-4 text-xs " +
          (tone === "error"
            ? "text-pink-300"
            : tone === "hint"
              ? "text-gray-400"
              : "text-purple-300");
      }

      function sync() {
        continueBtn.disabled = !isComplete() || verifying;
      }

      function focusFirstEmpty() {
        (inputs.find((i) => !i.value) || inputs[inputs.length - 1]).focus();
      }

      function fill(value) {
        const chars = value.replace(/\D/g, "").slice(0, inputs.length);
        inputs.forEach((input, i) => (input.value = chars[i] || ""));
        sync();
      }

      function replay(el, animation) {
        el.classList.remove(animation);
        void el.offsetWidth;
        el.classList.add(animation);
      }

      /* ---------- the popup ---------- */

      function showView(name) {
        Object.keys(cards).forEach((key) => {
          const card = cards[key];
          if (key === name) {
            card.classList.remove("hidden");
            requestAnimationFrame(() =>
              card.classList.remove("opacity-0", "scale-95"),
            );
          } else {
            card.classList.add("hidden", "opacity-0", "scale-95");
          }
        });
        openView = name;
        closers[name].focus();
      }

      function openModal(name) {
        if (name === "code") {
          digits.forEach((digit, i) => {
            digit.textContent = sentCode[i];
            digit.style.animationDelay = i * 60 + "ms";
            replay(digit, "pop");
          });
        } else {
          replay(successIcon, "pop");
        }

        modal.classList.remove("hidden");
        modal.classList.add("flex");
        requestAnimationFrame(() => modal.classList.remove("opacity-0"));
        showView(name);
      }

      function closeModal() {
        const closing = openView;
        modal.classList.add("opacity-0");
        if (closing) cards[closing].classList.add("opacity-0", "scale-95");
        openView = null;
        setTimeout(() => {
          modal.classList.add("hidden");
          modal.classList.remove("flex");
          if (closing) cards[closing].classList.add("hidden");
          if (closing === "success") reset();
          else continueBtn.focus();
        }, 200);
      }

      /* ---------- the flow ---------- */

      function requestCode() {
        if (revealed) {
          sentCode = nextCode();
          fill("");
          setStatus("A new code has been sent to ********78.");
        } else {
          revealed = true;
          setStatus("This is the code we sent to ********78.", "hint");
        }
        openModal("code");
      }

      function verify() {
        if (verifying) return;

        if (!isComplete()) {
          replay(otpRow, "shake");
          setStatus("Enter all 4 digits to continue.", "error");
          focusFirstEmpty();
          return;
        }

        verifying = true;
        sync();
        inputs.forEach((input) => (input.disabled = true));
        setStatus("Verifying…", "hint");

        setTimeout(() => {
          const matched = typedCode() === sentCode;
          verifying = false;
          inputs.forEach((input) => (input.disabled = false));

          if (matched) {
            setStatus("");
            openModal("success");
          } else {
            replay(otpRow, "shake");
            setStatus("That code doesn't match. Try again.", "error");
            fill("");
            inputs[0].focus();
          }
          sync();
        }, 550);
      }

      function reset() {
        sentCode = nextCode();
        revealed = false;
        fill("");
        setStatus("Tap RESEND CODE to see the code we sent.", "hint");
        inputs[0].focus();
      }

      /* ---------- inputs ---------- */

      inputs.forEach((input, index) => {
        input.addEventListener("focus", () => input.select());

        input.addEventListener("input", () => {
          input.value = input.value.replace(/\D/g, "").slice(0, 1);
          setStatus("");
          if (input.value && index < inputs.length - 1) {
            inputs[index + 1].focus();
          }
          sync();
          // filling the last box submits on its own
          if (input.value && index === inputs.length - 1 && isComplete()) {
            verify();
          }
        });

        input.addEventListener("keydown", (event) => {
          if (event.key === "Backspace" && !input.value && index > 0) {
            event.preventDefault();
            inputs[index - 1].value = "";
            inputs[index - 1].focus();
            sync();
          } else if (event.key === "ArrowLeft" && index > 0) {
            event.preventDefault();
            inputs[index - 1].focus();
          } else if (event.key === "ArrowRight" && index < inputs.length - 1) {
            event.preventDefault();
            inputs[index + 1].focus();
          } else if (event.key === "Enter") {
            event.preventDefault();
            verify();
          }
        });

        input.addEventListener("paste", (event) => {
          event.preventDefault();
          fill(event.clipboardData.getData("text"));
          setStatus("");
          if (isComplete()) verify();
          else focusFirstEmpty();
        });
      });

      /* ---------- buttons ---------- */

      continueBtn.addEventListener("click", verify);
      resendBtn.addEventListener("click", requestCode);

      backBtn.addEventListener("click", () => {
        fill("");
        setStatus("");
        inputs[0].focus();
      });

      [
        document.getElementById("closeIconBtn"),
        document.getElementById("closeTextBtn"),
        document.getElementById("successCloseIconBtn"),
        document.getElementById("doneBtn"),
      ].forEach((btn) => btn.addEventListener("click", closeModal));

      modal.addEventListener("click", (event) => {
        if (event.target === modal) closeModal();
      });

      document.addEventListener("keydown", (event) => {
        if (event.key === "Escape" && openView) closeModal();
      });

      sync();
      setStatus("Tap RESEND CODE to see the code we sent.", "hint");
      inputs[0].focus();
    </script>
  </body>
</html>
