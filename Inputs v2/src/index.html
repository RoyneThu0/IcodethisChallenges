<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Linked Filter Cards</title>
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <link href="./output.css" rel="stylesheet" />
  </head>
  <body
    class="flex min-h-screen w-full flex-col items-center justify-center gap-6 bg-pink-50 bg-cover bg-center bg-no-repeat p-4 sm:p-6 md:flex-row md:items-center md:gap-8 lg:gap-12 lg:p-12"
    style="
      background-image: linear-gradient(
          140deg,
          rgb(253 242 248 / 0.7),
          rgb(252 231 243 / 0.5)
        ),
        url('https://images.unsplash.com/photo-1660489352385-2fd03e42c408?w=900&auto=format&fit=crop&q=60&ixlib=rb-4.1.0&ixid=M3wxMjA3fDB8MHxzZWFyY2h8NTl8fHBpbmt8ZW58MHwwfDB8fHww');
    "
  >
    <!-- Days -->
    <section
      class="w-full max-w-sm rounded-2xl bg-white/95 p-5 shadow-xl shadow-pink-900/10 ring-1 ring-pink-100 backdrop-blur-sm transition duration-300 hover:-translate-y-1 hover:shadow-2xl hover:shadow-pink-900/20 md:w-72 md:max-w-none"
    >
      <div class="flex items-center gap-2 border-b border-slate-100 pb-3">
        <svg
          class="size-5 shrink-0 text-pink-500"
          fill="none"
          viewBox="0 0 24 24"
          stroke-width="1.5"
          stroke="currentColor"
          aria-hidden="true"
        >
          <path
            stroke-linecap="round"
            stroke-linejoin="round"
            d="M6.75 3v2.25M17.25 3v2.25M3 18.75V7.5a2.25 2.25 0 0 1 2.25-2.25h13.5A2.25 2.25 0 0 1 21 7.5v11.25m-18 0A2.25 2.25 0 0 0 5.25 21h13.5A2.25 2.25 0 0 0 21 18.75m-18 0v-7.5A2.25 2.25 0 0 1 5.25 9h13.5A2.25 2.25 0 0 1 21 11.25v7.5"
          />
        </svg>
        <h2 class="font-semibold tracking-tight text-slate-900">Days</h2>
      </div>

      <div class="mt-3 grid grid-cols-2 gap-x-2 gap-y-0.5 sm:grid-cols-1">
        <label
          class="flex cursor-pointer items-center gap-3 rounded-lg px-2 py-2 text-sm text-slate-600 transition-colors hover:bg-pink-50 has-[:checked]:bg-pink-50 has-[:checked]:font-medium has-[:checked]:text-pink-600"
        >
          <input
            type="checkbox"
            class="size-4 shrink-0 cursor-pointer accent-pink-500"
          />
          Monday
        </label>
        <label
          class="flex cursor-pointer items-center gap-3 rounded-lg px-2 py-2 text-sm text-slate-600 transition-colors hover:bg-pink-50 has-[:checked]:bg-pink-50 has-[:checked]:font-medium has-[:checked]:text-pink-600"
        >
          <input
            type="checkbox"
            checked
            class="size-4 shrink-0 cursor-pointer accent-pink-500"
          />
          Tuesday
        </label>
        <label
          class="flex cursor-pointer items-center gap-3 rounded-lg px-2 py-2 text-sm text-slate-600 transition-colors hover:bg-pink-50 has-[:checked]:bg-pink-50 has-[:checked]:font-medium has-[:checked]:text-pink-600"
        >
          <input
            type="checkbox"
            checked
            class="size-4 shrink-0 cursor-pointer accent-pink-500"
          />
          Wednesday
        </label>
        <label
          class="flex cursor-pointer items-center gap-3 rounded-lg px-2 py-2 text-sm text-slate-600 transition-colors hover:bg-pink-50 has-[:checked]:bg-pink-50 has-[:checked]:font-medium has-[:checked]:text-pink-600"
        >
          <input
            type="checkbox"
            class="size-4 shrink-0 cursor-pointer accent-pink-500"
          />
          Thursday
        </label>
        <label
          class="flex cursor-pointer items-center gap-3 rounded-lg px-2 py-2 text-sm text-slate-600 transition-colors hover:bg-pink-50 has-[:checked]:bg-pink-50 has-[:checked]:font-medium has-[:checked]:text-pink-600"
        >
          <input
            type="checkbox"
            checked
            class="size-4 shrink-0 cursor-pointer accent-pink-500"
          />
          Friday
        </label>
        <label
          class="flex cursor-pointer items-center gap-3 rounded-lg px-2 py-2 text-sm text-slate-600 transition-colors hover:bg-pink-50 has-[:checked]:bg-pink-50 has-[:checked]:font-medium has-[:checked]:text-pink-600"
        >
          <input
            type="checkbox"
            class="size-4 shrink-0 cursor-pointer accent-pink-500"
          />
          Saturday
        </label>
        <label
          class="flex cursor-pointer items-center gap-3 rounded-lg px-2 py-2 text-sm text-slate-600 transition-colors hover:bg-pink-50 has-[:checked]:bg-pink-50 has-[:checked]:font-medium has-[:checked]:text-pink-600"
        >
          <input
            type="checkbox"
            class="size-4 shrink-0 cursor-pointer accent-pink-500"
          />
          Sunday
        </label>
      </div>

      <button
        type="button"
        class="mt-5 flex w-full cursor-pointer items-center justify-center gap-2 rounded-lg bg-slate-900 px-4 py-2.5 text-sm font-medium text-white transition duration-300 hover:bg-slate-700 focus-visible:outline-2 focus-visible:outline-offset-2 focus-visible:outline-pink-500 active:scale-95"
      >
        <svg
          class="size-4 shrink-0"
          fill="none"
          viewBox="0 0 24 24"
          stroke-width="2"
          stroke="currentColor"
          aria-hidden="true"
        >
          <path
            stroke-linecap="round"
            stroke-linejoin="round"
            d="M6 18 18 6M6 6l12 12"
          />
        </svg>
        Remove all filters
      </button>
    </section>

    <div
      class="flex w-full max-w-sm flex-col gap-6 md:w-72 md:max-w-none md:gap-8"
    >
      <!-- Settings -->
      <section
        class="rounded-2xl bg-white/95 p-5 shadow-xl shadow-pink-900/10 ring-1 ring-pink-100 backdrop-blur-sm transition duration-300 hover:-translate-y-1 hover:shadow-2xl hover:shadow-pink-900/20"
      >
        <div class="flex items-center gap-2 border-b border-slate-100 pb-3">
          <button
            type="button"
            aria-label="Go back"
            class="-ml-1 cursor-pointer rounded-lg p-1 text-slate-500 transition-colors hover:bg-pink-50 hover:text-pink-600 focus-visible:outline-2 focus-visible:outline-offset-2 focus-visible:outline-pink-500"
          >
            <svg
              class="size-5"
              fill="none"
              viewBox="0 0 24 24"
              stroke-width="1.5"
              stroke="currentColor"
              aria-hidden="true"
            >
              <path
                stroke-linecap="round"
                stroke-linejoin="round"
                d="M10.5 19.5 3 12m0 0 7.5-7.5M3 12h18"
              />
            </svg>
          </button>
          <h2 class="font-semibold tracking-tight text-slate-900">Settings</h2>
        </div>

        <div class="mt-4 space-y-4">
          <div class="flex items-center justify-between gap-4">
            <span class="text-sm text-slate-600">Smart sorting</span>
            <label
              class="relative inline-flex shrink-0 cursor-pointer items-center"
            >
              <input type="checkbox" class="peer sr-only" checked />
              <span
                class="block h-6 w-11 rounded-full bg-slate-200 transition-colors duration-300 peer-checked:bg-pink-500 peer-focus-visible:outline-2 peer-focus-visible:outline-offset-2 peer-focus-visible:outline-pink-500"
              ></span>
              <span
                class="pointer-events-none absolute left-1 top-1 size-4 rounded-full bg-white shadow-sm transition-transform duration-300 peer-checked:translate-x-5"
              ></span>
            </label>
          </div>

          <div class="flex items-center justify-between gap-4">
            <label for="theme" class="whitespace-nowrap text-sm text-slate-600"
              >Toggle theme</label
            >
            <div class="relative shrink-0">
              <select
                id="theme"
                class="w-28 cursor-pointer appearance-none rounded-lg border border-slate-200 bg-white py-1.5 pl-3 pr-8 text-sm text-slate-700 transition-colors hover:border-pink-300 focus-visible:border-pink-400 focus-visible:outline-2 focus-visible:outline-offset-1 focus-visible:outline-pink-500"
              >
                <option>Light</option>
                <option>Dark</option>
              </select>
              <svg
                class="pointer-events-none absolute right-2.5 top-1/2 size-4 -translate-y-1/2 text-slate-400"
                fill="none"
                viewBox="0 0 24 24"
                stroke-width="2"
                stroke="currentColor"
                aria-hidden="true"
              >
                <path
                  stroke-linecap="round"
                  stroke-linejoin="round"
                  d="m19.5 8.25-7.5 7.5-7.5-7.5"
                />
              </svg>
            </div>
          </div>

          <div>
            <label for="language" class="text-sm text-slate-600"
              >Choose language</label
            >
            <div class="relative mt-1.5">
              <select
                id="language"
                class="w-full cursor-pointer appearance-none rounded-lg border border-slate-200 bg-white py-2 pl-3 pr-8 text-sm text-slate-700 transition-colors hover:border-pink-300 focus-visible:border-pink-400 focus-visible:outline-2 focus-visible:outline-offset-1 focus-visible:outline-pink-500"
              >
                <option>English</option>
                <option>French</option>
                <option>Spanish</option>
              </select>
              <svg
                class="pointer-events-none absolute right-2.5 top-1/2 size-4 -translate-y-1/2 text-slate-400"
                fill="none"
                viewBox="0 0 24 24"
                stroke-width="2"
                stroke="currentColor"
                aria-hidden="true"
              >
                <path
                  stroke-linecap="round"
                  stroke-linejoin="round"
                  d="m19.5 8.25-7.5 7.5-7.5-7.5"
                />
              </svg>
            </div>
          </div>
        </div>
      </section>

      <!-- Types -->
      <section
        class="rounded-2xl bg-white/95 p-5 shadow-xl shadow-pink-900/10 ring-1 ring-pink-100 backdrop-blur-sm transition duration-300 hover:-translate-y-1 hover:shadow-2xl hover:shadow-pink-900/20"
      >
        <div class="flex items-center gap-2 border-b border-slate-100 pb-3">
          <svg
            class="size-5 shrink-0 text-pink-500"
            fill="none"
            viewBox="0 0 24 24"
            stroke-width="1.5"
            stroke="currentColor"
            aria-hidden="true"
          >
            <path
              stroke-linecap="round"
              stroke-linejoin="round"
              d="M9.568 3H5.25A2.25 2.25 0 0 0 3 5.25v4.318c0 .597.237 1.17.659 1.591l9.581 9.581c.699.699 1.877.53 2.32-.353a12.02 12.02 0 0 1 4.74-4.74c.883-.443 1.052-1.621.353-2.32L11.16 3.66A2.25 2.25 0 0 0 9.568 3Z"
            />
            <path
              stroke-linecap="round"
              stroke-linejoin="round"
              d="M6 6h.008v.008H6V6Z"
            />
          </svg>
          <h2 class="font-semibold tracking-tight text-slate-900">Types</h2>
        </div>

        <div class="relative mt-4">
          <select
            aria-label="Filter by type"
            class="w-full cursor-pointer appearance-none rounded-lg border border-slate-200 bg-white py-2 pl-3 pr-8 text-sm text-slate-700 transition-colors hover:border-pink-300 focus-visible:border-pink-400 focus-visible:outline-2 focus-visible:outline-offset-1 focus-visible:outline-pink-500"
          >
            <option>All types</option>
            <option>Product Discovery</option>
            <option>Software</option>
          </select>
          <svg
            class="pointer-events-none absolute right-2.5 top-1/2 size-4 -translate-y-1/2 text-slate-400"
            fill="none"
            viewBox="0 0 24 24"
            stroke-width="2"
            stroke="currentColor"
            aria-hidden="true"
          >
            <path
              stroke-linecap="round"
              stroke-linejoin="round"
              d="m19.5 8.25-7.5 7.5-7.5-7.5"
            />
          </svg>
        </div>

        <div class="mt-3 flex flex-col gap-0.5">
          <label
            class="flex cursor-pointer items-center gap-3 rounded-lg px-2 py-2 text-sm text-slate-600 transition-colors hover:bg-pink-50 has-[:checked]:bg-pink-50 has-[:checked]:font-medium has-[:checked]:text-pink-600"
          >
            <input
              type="checkbox"
              class="size-4 shrink-0 cursor-pointer accent-pink-500"
            />
            Product Discovery
          </label>
          <label
            class="flex cursor-pointer items-center gap-3 rounded-lg px-2 py-2 text-sm text-slate-600 transition-colors hover:bg-pink-50 has-[:checked]:bg-pink-50 has-[:checked]:font-medium has-[:checked]:text-pink-600"
          >
            <input
              type="checkbox"
              checked
              class="size-4 shrink-0 cursor-pointer accent-pink-500"
            />
            Software
          </label>
          <label
            class="flex cursor-pointer items-center gap-3 rounded-lg px-2 py-2 text-sm text-slate-600 transition-colors hover:bg-pink-50 has-[:checked]:bg-pink-50 has-[:checked]:font-medium has-[:checked]:text-pink-600"
          >
            <input
              type="checkbox"
              class="size-4 shrink-0 cursor-pointer accent-pink-500"
            />
            Service Management
          </label>
          <label
            class="flex cursor-pointer items-center gap-3 rounded-lg px-2 py-2 text-sm text-slate-600 transition-colors hover:bg-pink-50 has-[:checked]:bg-pink-50 has-[:checked]:font-medium has-[:checked]:text-pink-600"
          >
            <input
              type="checkbox"
              class="size-4 shrink-0 cursor-pointer accent-pink-500"
            />
            Business
          </label>
        </div>
      </section>
    </div>
  </body>
</html>
