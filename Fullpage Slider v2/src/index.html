<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Centered Infinite Slider</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
      .carousel-item {
        flex: 0 0 80%;
        /* Show central item big, sides peeking */
        transition:
          transform 0.5s ease,
          filter 0.5s ease;
      }

      .inactive {
        filter: grayscale(100%);
        transform: scale(0.9);
      }

      .active {
        filter: grayscale(0%);
        transform: scale(1);
      }
    </style>
  </head>

  <body class="bg-gray-100 flex items-center justify-center h-screen">
    <div class="relative w-full overflow-hidden">
      <div
        id="carousel"
        class="flex transition-transform duration-500 ease-in-out"
      >
        <div class="carousel-item inactive px-2">
          <img
            src="https://picsum.photos/id/1018/800/400"
            class="w-full rounded-xl shadow-lg"
          />
        </div>
        <div class="carousel-item active px-2">
          <img
            src="https://picsum.photos/id/1015/800/400"
            class="w-full rounded-xl shadow-lg"
          />
        </div>
        <div class="carousel-item inactive px-2">
          <img
            src="https://picsum.photos/id/1019/800/400"
            class="w-full rounded-xl shadow-lg"
          />
        </div>
        <div class="carousel-item inactive px-2">
          <img
            src="https://picsum.photos/id/1020/800/400"
            class="w-full rounded-xl shadow-lg"
          />
        </div>
      </div>

      <button
        id="prev"
        class="absolute left-2 top-1/2 transform -translate-y-1/2 bg-white p-2 rounded-full shadow"
      >
        ◀
      </button>
      <button
        id="next"
        class="absolute right-2 top-1/2 transform -translate-y-1/2 bg-white p-2 rounded-full shadow"
      >
        ▶
      </button>
    </div>

    <script>
      const carousel = document.getElementById("carousel");
      const originalItems = Array.from(carousel.children);
      const total = originalItems.length;
      carousel.prepend(originalItems[total - 1].cloneNode(true));
      carousel.append(originalItems[0].cloneNode(true));

      const items = Array.from(carousel.children);
      let index = 1;
      let isAnimating = false;

      function updateCarousel(animate = true) {
        if (!animate) carousel.style.transition = "none";
        const offset = -index * items[0].offsetWidth;
        carousel.style.transform = `translateX(${offset + (carousel.parentElement.offsetWidth / 2 - items[0].offsetWidth / 2)}px)`;

        const activeIndex = (index - 1 + total) % total;
        items.forEach((item, i) => {
          if ((i - 1 + total) % total === activeIndex) {
            item.classList.remove("inactive");
            item.classList.add("active");
          } else {
            item.classList.remove("active");
            item.classList.add("inactive");
          }
        });

        if (!animate) {
          carousel.offsetWidth;
          carousel.style.transition = "";
        }
      }

      carousel.addEventListener("transitionend", (event) => {
        if (event.target !== carousel || event.propertyName !== "transform")
          return;

        if (index === 0) {
          index = total;
          updateCarousel(false);
        } else if (index === total + 1) {
          index = 1;
          updateCarousel(false);
        }
        isAnimating = false;
      });

      document.getElementById("prev").addEventListener("click", () => {
        if (isAnimating) return;
        isAnimating = true;
        index--;
        updateCarousel();
      });

      document.getElementById("next").addEventListener("click", () => {
        if (isAnimating) return;
        isAnimating = true;
        index++;
        updateCarousel();
      });

      window.addEventListener("load", () => updateCarousel(false));
      window.addEventListener("resize", () => updateCarousel(false));
    </script>
  </body>
</html>
