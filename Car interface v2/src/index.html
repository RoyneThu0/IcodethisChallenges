      rel="stylesheet"

      integrity="sha512-DTOQO9RWCH3ppGqcWaEA1BIZOC6xxalwEsw9c2QQeAIftl+Vegovlnee1c9QX4TctnWMn13TZye+giMm8e2LwA=="
      crossorigin="anonymous"
      referrerpolicy="no-referrer"
    />
    <style>
      @property --accent {
        syntax: "<color>";
        inherits: true;
        initial-value: #c4e45c;
      }
      @property --sec {
        syntax: "<integer>";
        inherits: false;
        initial-value: 0;
      }
      @property --min {
        syntax: "<integer>";
        inherits: false;
        initial-value: 0;
      }

      .cluster {
        transition: --accent 0.6s ease;
      }

      .tk-minor {
        stroke: rgb(255 255 255 / 0.25);
        stroke-width: 1;
      }
      .tk-major {
        stroke: #fff;
        stroke-width: 1.8;
        stroke-linecap: round;
      }
      .tk-red {
        stroke: #ff453a;
      }
      .labels {
        fill: rgb(255 255 255 / 0.7);
        font-size: 11px;
        font-weight: 500;
        text-anchor: middle;
        dominant-baseline: central;
      }
      .arc-value {
        stroke: var(--accent);
        stroke-dasharray: var(--v) 360;
        filter: drop-shadow(0 0 6px var(--accent));
        animation: sweep-arc 1.8s cubic-bezier(0.2, 0.8, 0.2, 1) 0.3s both;
      }
      .needle {
        fill: var(--accent);
        filter: drop-shadow(0 0 4px var(--accent));
        transform-box: view-box;
        transform-origin: 120px 120px;
        transform: rotate(var(--to));
        animation: sweep-needle 1.8s cubic-bezier(0.2, 0.8, 0.2, 1) 0.3s both;
      }
      @keyframes sweep-arc {
        from {
          stroke-dasharray: 0 360;
        }
      }
      @keyframes sweep-needle {
        from {
          transform: rotate(-135deg);
        }
      }

      .call-timer::before {
        counter-reset: min var(--min) sec var(--sec);
        content: counter(min, decimal-leading-zero) ":"
          counter(sec, decimal-leading-zero);
        animation:
          tick-sec 60s steps(60) infinite,
          tick-min 3600s steps(60) infinite;
      }
      @keyframes tick-sec {
        to {
          --sec: 60;
        }
      }
      @keyframes tick-min {
        to {
          --min: 60;
        }
      }

      .route {
        stroke-dasharray: 1;
        animation: draw-route 1.4s ease-out both;
      }
      @keyframes draw-route {
        from {
          stroke-dashoffset: 1;
        }
      }
    </style>
  </head>
