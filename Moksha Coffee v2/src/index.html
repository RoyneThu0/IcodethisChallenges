<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Moksha Coffee</title>
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>

    <link href="./output.css" rel="stylesheet" />
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css"
      integrity="sha512DTOQO9RWCH3ppGqcWaEA1BIZOC6xxalwEsw9c2QQeAIftl+Vegovlnee1c9QX4TctnWMn13TZye+giMm8e2LwA=="
      crossorigin="anonymous"
      referrerpolicy="noreferrer"
    />
  </head>

  <body
    class="min-h-screen flex items-center justify-center bg-gray-700 px-3 py-4 sm:px-0 sm:py-0"
  >
    <div
      class="bg-gray-800 w-full sm:w-11/12 max-w-6xl rounded-sm shadow-lg shadow-gray-900/80"
    >
      <nav
        class="w-full relative pt-6 pb-4 sm:pt-8 sm:pb-2 flex flex-col sm:flex-row items-center justify-center gap-6 sm:gap-52"
      >
        <ul
          class="flex flex-wrap justify-center items-center gap-2 sm:gap-3 sm:order-1 order-2"
        >
          <li>
            <a
              href="#"
              class="text-white text-sm sm:text-base font-mono hover:font-bold hover:text-red-500"
              >Our Story</a
            >
          </li>
          <li class="text-gray-950 text-xs sm:text-sm">■</li>
          <li>
            <a
              href="#"
              class="text-white text-sm sm:text-base font-mono hover:font-bold hover:text-red-500"
              >Food</a
            >
          </li>
        </ul>
        <div
          class="bg-white z-10 relative sm:absolute snap-center sm:left-1/2 sm:top-1/2 px-4 sm:px-6 py-5 sm:py-5 sm:transform sm:-translate-x-1/2 sm:-translate-y-1/2 shadow-xl shadow-gray-900/80 order-1 sm:order-none"
        >
          <p class="font-bold text-2xl sm:text-3xl font-mono">Moksha</p>
        </div>
        <ul
          class="flex flex-wrap justify-center items-center gap-2 sm:gap-3 sm:order-3 order-3"
        >
          <li>
            <a
              href="#"
              class="text-white text-sm sm:text-base font-mono hover:font-bold hover:text-red-500"
              >Coffee</a
            >
          </li>
          <li class="text-gray-950 text-xs sm:text-sm">■</li>
          <li>
            <a
              href="#"
              class="text-white text-sm sm:text-base font-mono hover:font-bold hover:text-red-500"
              >Find Us</a
            >
          </li>
        </ul>
      </nav>
      <div
        class="w-full h-64 sm:h-96 md:h-[500px] bg-cover bg-center mx-auto"
        style="
          background-image: url(https://toasterding.com/wp-content/uploads/2024/10/photo-1453614512568-c4024d13c247-scaled.jpg);
        "
      >
        <div
          class="w-full h-full backdrop-filter backdrop-blur-xs bg-amber-950/40 bg-opacity-50 flex flex-col items-center justify-center px-4"
        >
          <h1
            class="text-white font-bold text-2xl sm:text-3xl md:text-4xl font-serif text-center"
          >
            OUR COFFEE
          </h1>
          <p
            class="mt-3 sm:mt-5 text-white font-mono text-center text-xs sm:text-sm md:text-base leading-relaxed max-w-2xl"
          >
            When it comes to the important stuff – the coffee – we are committed
            <br class="hidden sm:block" />
            to sourcing and serving one of the highest quality and we believe is
            <br class="hidden sm:block" />
            nothing short of best coffee possible.
          </p>
          <button
            class="mt-6 sm:mt-10 px-4 sm:px-6 py-2 sm:py-3 border-2 sm:border-3 border-white text-white text-sm sm:text-base font-bold hover:bg-red-500 transition-colors"
          >
            Download our menu
          </button>
        </div>
      </div>
      <div class="mt-8 sm:mt-10 px-4 sm:px-5 pb-10">
        <p class="text-white font-mono text-lg sm:text-xl text-start mb-4">
          Gallery
        </p>

        <div class="flex items-center justify-center gap-2 sm:gap-3">
          <button
            id="prevBtn"
            class="hidden sm:block flex-shrink-0 cursor-pointer hover:opacity-75 transition-opacity"
          >
            <i
              class="fa-solid text-5xl sm:text-7xl text-white fa-chevron-left"
            ></i>
          </button>
          <div
            class="flex items-center justify-center min-w-0 flex-1 overflow-hidden"
          >
            <ul
              id="carousel"
              class="grid grid-cols-2 sm:grid-cols-3 md:grid-cols-4 mt-5 gap-2 w-full transition-transform duration-300 ease-in-out"
            >
              <li class="w-full">
                <img
                  src="https://images.unsplash.com/photo-1521302080334-4bebac2763a6?w=900&auto=format&fit=crop&q=60&ixlib=rb-4.1.0&ixid=M3wxMjA3fDB8MHxzZWFyY2h8M3x8Y29mZmVlfGVufDB8MnwwfHx8MA%3D%3D"
                  alt="Coffee Image"
                  class="h-32 sm:h-40 md:h-48 w-full object-cover hover:scale-110 duration-300 ease-in-out cursor-pointer"
                />
              </li>
              <li class="w-full">
                <img
                  src="https://images.unsplash.com/photo-1519333796630-4b7d19ad1bb3?w=900&auto=format&fit=crop&q=60&ixlib=rb-4.1.0&ixid=M3wxMjA3fDB8MHxzZWFyY2h8NHx8Y29mZmVlfGVufDB8MnwwfHx8MA%3D%3D"
                  alt="Coffee Image"
                  class="h-32 sm:h-40 md:h-48 w-full object-cover hover:scale-110 duration-300 ease-in-out cursor-pointer"
                />
              </li>
              <li class="w-full hidden sm:block">
                <img
                  src="https://images.unsplash.com/photo-1669872484166-e11b9638b50e?w=900&auto=format&fit=crop&q=60&ixlib=rb-4.1.0&ixid=M3wxMjA3fDB8MHxzZWFyY2h8Nnx8Y29mZmVlfGVufDB8MnwwfHx8MA%3D%3D"
                  alt="Coffee Image"
                  class="h-40 md:h-48 w-full object-cover hover:scale-110 duration-300 ease-in-out cursor-pointer"
                />
              </li>
              <li class="w-full hidden md:block">
                <img
                  src="https://images.unsplash.com/photo-1592663527144-3afb8d150556?w=900&auto=format&fit=crop&q=60&ixlib=rb-4.1.0&ixid=M3wxMjA3fDB8MHxzZWFyY2h8MTB8fGNvZmZlZXxlbnwwfDJ8MHx8fDA%3D"
                  alt="Coffee Image"
                  class="h-48 w-full object-cover hover:scale-110 duration-300 ease-in-out cursor-pointer"
                />
              </li>
            </ul>
          </div>
          <button
            id="nextBtn"
            class="hidden sm:block flex-shrink-0 cursor-pointer hover:opacity-75 transition-opacity"
          >
            <i
              class="fa-solid text-5xl sm:text-7xl text-white fa-chevron-right"
            ></i>
          </button>
        </div>
      </div>
    </div>

    <script>
      const carousel = document.getElementById("carousel");
      const prevBtn = document.getElementById("prevBtn");
      const nextBtn = document.getElementById("nextBtn");
      let currentIndex = 0;
      const itemsPerView = () => {
        if (window.innerWidth >= 768) return 4;
        if (window.innerWidth >= 640) return 3;
        return 2;
      };

      const scrollCarousel = (direction) => {
        const itemsToShow = itemsPerView();
        const totalItems = carousel.children.length;
        const maxIndex = Math.max(0, totalItems - itemsToShow);

        if (direction === "next") {
          currentIndex = Math.min(currentIndex + 1, maxIndex);
        } else {
          currentIndex = Math.max(currentIndex - 1, 0);
        }

        const gap = 8; // gap-2 = 0.5rem = 8px
        const itemWidth = carousel.children[0].offsetWidth;
        const offset = currentIndex * (itemWidth + gap);
        carousel.style.transform = `translateX(-${offset}px)`;
      };

      prevBtn.addEventListener("click", () => scrollCarousel("prev"));
      nextBtn.addEventListener("click", () => scrollCarousel("next"));

      window.addEventListener("resize", () => {
        currentIndex = 0;
        carousel.style.transform = "translateX(0)";
      });
    </script>
  </body>
</html>
