<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Profile dropdown</title>
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <link href="./output.css" rel="stylesheet" />
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css"
      integrity="sha512-DTOQO9RWCH3ppGqcWaEA1BIZOC6xxalwEsw9c2QQeAIftl+Vegovlnee1c9QX4TctnWMn13TZye+giMm8e2LwA=="
      crossorigin="anonymous"
      referrerpolicy="no-referrer"
    />
  </head>
  <body
    class="flex min-h-screen w-full items-center justify-center bg-[#3d3c46] p-4 text-[#faf9ff] antialiased"
  >
    <main
      class="flex w-full max-w-146 justify-center rounded-lg bg-[#393841] px-4 pt-22 pb-20 shadow-2xl shadow-black/20"
    >
      <div class="relative w-full max-w-105">
        <input type="checkbox" id="profile-menu" class="peer sr-only" checked />

        <header
          class="flex items-center justify-end gap-9.5 pr-1.5 peer-focus-visible:[&_label]:outline-2 peer-focus-visible:[&_label]:outline-offset-4 peer-focus-visible:[&_label]:outline-[#f0935e]"
        >
          <button
            type="button"
            aria-label="Notifications"
            class="cursor-pointer text-2xl text-[#878690] transition-colors hover:text-[#faf9ff] focus-visible:text-[#faf9ff] focus-visible:outline-none"
          >
            <i class="fa-regular fa-bell"></i>
          </button>
          <label
            for="profile-menu"
            aria-label="Toggle profile menu"
            class="size-12.5 cursor-pointer overflow-hidden rounded-full border-2 border-[#a1b6c2] shadow-lg shadow-black/30 transition-transform hover:scale-105"
          >
            <img
              src="https://images.unsplash.com/photo-1712584429256-a9d09a81c3b0?w=900&auto=format&fit=crop&q=60&ixlib=rb-4.1.0&ixid=NHwxMjA3fDA%3D"
              alt="Stella Swanson"
              class="size-full object-cover"
            />
          </label>
        </header>

        <section
          aria-label="Profile menu"
          class="invisible relative mt-5.5 translate-y-2 rounded-sm bg-[#42414b] px-6 opacity-0 shadow-2xl shadow-black/30 transition duration-200 peer-checked:visible peer-checked:translate-y-0 peer-checked:opacity-100 before:absolute before:-top-1.5 before:right-6 before:size-3.5 before:rotate-45 before:rounded-xs before:bg-[#42414b]"
        >
          <div
            class="flex items-center gap-5 border-b border-[#3b3a44] pt-8.5 pb-9 sm:gap-8 sm:px-3"
          >
            <img
              src="https://images.unsplash.com/photo-1712584429256-a9d09a81c3b0?w=900&auto=format&fit=crop&q=60&ixlib=rb-4.1.0&ixid=NHwxMjA3fDA%3D"
              alt="Stella Swanson"
              class="size-18 shrink-0 sm:size-23 rounded-full object-cover shadow-xl shadow-black/30"
            />
            <div class="min-w-0">
              <h2 class="truncate text-lg font-semibold">Stella Swanson</h2>
              <p class="mt-0.5 truncate text-sm text-[#b9b8c2]">
                stella67@email.com
              </p>
              <a
                href="#"
                class="mt-3.5 inline-block rounded-xs whitespace-nowrap bg-linear-to-r from-[#f39a73] to-[#eb8e43] px-5.5 py-2.5 text-sm font-semibold text-white shadow-lg shadow-[#eb8e43]/20 transition hover:brightness-110 focus-visible:outline-2 focus-visible:outline-offset-2 focus-visible:outline-[#f0935e]"
              >
                Account Settings
              </a>
            </div>
          </div>

          <ul
            class="flex flex-col gap-0.5 border-b border-[#3b3a44] pt-4 pb-3.5"
          >
            <li>
              <a
                href="#"
                class="-mx-3 flex items-center gap-5 rounded-lg px-3 py-3 transition-colors hover:bg-white/4 focus-visible:bg-white/4 focus-visible:outline-none"
              >
                <span
                  class="grid size-15 shrink-0 place-items-center rounded-full bg-[#77c8b5] text-lg font-bold"
                  aria-hidden="true"
                  >SS</span
                >
                <span class="min-w-0">
                  <span class="block text-lg font-semibold"
                    >Stella Swanson</span
                  >
                  <span class="block truncate text-sm text-[#b9b8c2]"
                    >support@email.com</span
                  >
                </span>
              </a>
            </li>
            <li>
              <a
                href="#"
                class="-mx-3 flex items-center gap-5 rounded-lg px-3 py-3 transition-colors hover:bg-white/4 focus-visible:bg-white/4 focus-visible:outline-none"
              >
                <span
                  class="grid size-15 shrink-0 place-items-center rounded-full bg-[#769acc] text-lg font-bold"
                  aria-hidden="true"
                  >SS</span
                >
                <span class="min-w-0">
                  <span class="block text-lg font-semibold"
                    >Stella Swanson</span
                  >
                  <span class="block truncate text-sm text-[#b9b8c2]"
                    >accounting@email.com</span
                  >
                </span>
              </a>
            </li>
            <li>
              <a
                href="#"
                class="-mx-3 flex items-center gap-5 rounded-lg px-3 py-3 transition-colors hover:bg-white/4 focus-visible:bg-white/4 focus-visible:outline-none"
              >
                <span
                  class="grid size-15 shrink-0 place-items-center rounded-full bg-[#bc78ca] text-lg font-bold"
                  aria-hidden="true"
                  >SS</span
                >
                <span class="min-w-0">
                  <span class="block text-lg font-semibold"
                    >Stella Swanson</span
                  >
                  <span class="block truncate text-sm text-[#b9b8c2]"
                    >hello@email.com</span
                  >
                </span>
              </a>
            </li>
          </ul>
          <div class="flex items-center justify-between pt-5 pb-5">
            <button
              type="button"
              aria-label="Add account"
              class="group relative grid size-15 cursor-pointer place-items-center rounded-full border-2 border-dashed border-[#393841] text-2xl transition-colors hover:border-[#5a5964] focus-visible:border-[#5a5964] focus-visible:outline-none"
            >
              <i class="fa-solid fa-plus"></i>
              <span
                role="tooltip"
                class="pointer-events-none absolute top-full left-1/2 mt-4 -translate-x-1/2 translate-y-1 rounded-sm bg-[#2e2e33] px-6 py-2.5 text-sm whitespace-nowrap text-[#e4e3ea] opacity-0 shadow-xl shadow-black/30 transition duration-200 group-hover:translate-y-0 group-hover:opacity-100 group-focus-visible:translate-y-0 group-focus-visible:opacity-100 before:absolute before:-top-1 before:left-1/2 before:size-2.5 before:-translate-x-1/2 before:rotate-45 before:bg-[#2e2e33]"
              >
                Add Account
              </span>
            </button>
            <button
              type="button"
              class="cursor-pointer rounded-xs border-2 border-[#3a3943] px-12 py-2 text-sm text-[#e4e3ea] transition-colors hover:border-[#5a5964] hover:bg-white/4 focus-visible:border-[#5a5964] focus-visible:outline-none"
            >
              Sign Out
            </button>
          </div>
        </section>
      </div>
    </main>
  </body>
</html>
