<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Keyboard</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css"
    />
    <style type="text/tailwindcss">
      @layer components {
        .kbd-shell {
          @apply rounded-[28px] border border-white/15 bg-[linear-gradient(145deg,_#2c2ca6_0%,_#1b1b75_50%,_#12124d_100%)] p-4 shadow-[0_24px_50px_rgba(3,7,29,0.35),inset_0_1px_0_rgba(255,255,255,0.18)] sm:p-6;
        }

        .kbd-row {
          @apply mb-3 flex items-center justify-between gap-[0.6rem];
        }

        .kbd-row-offset {
          @apply px-3 sm:px-5;
        }

        .kbd-row-bottom {
          @apply mb-0 pt-2;
        }

        .kbd-key {
          @apply flex h-14 w-14 items-center justify-center rounded-[0.9rem] border border-white/15 bg-gradient-to-b from-[#3f41bd] to-[#2f2f9a] text-lg font-semibold text-white shadow-[inset_0_1px_0_rgba(255,255,255,0.16),0_8px_16px_rgba(8,11,48,0.22)] transition hover:-translate-y-0.5 hover:brightness-105 active:translate-y-0.5;
        }

        .kbd-key-accent {
          @apply from-[#4d4fce] to-[#2f2f9a] text-base font-medium;
        }

        .kbd-key-space {
          @apply min-w-[12rem] flex-1 bg-gradient-to-b from-[#3d3db5] to-[#2a2a86] text-sm font-medium uppercase tracking-[0.25em];
        }
      }
    </style>
  </head>
  <body
    class="flex min-h-screen items-center justify-center bg-[radial-gradient(circle_at_top,_#4f7cff,_#1236a8_70%,_#081b5d)] px-4 py-10 text-white"
  >
    <div class="w-[760px]">
      <div class="kbd-shell">
        <div class="kbd-row">
          <button class="kbd-key">Q</button>
          <button class="kbd-key">W</button>
          <button class="kbd-key">E</button>
          <button class="kbd-key">R</button>
          <button class="kbd-key">T</button>
          <button class="kbd-key">Y</button>
          <button class="kbd-key">U</button>
          <button class="kbd-key">I</button>
          <button class="kbd-key">O</button>
          <button class="kbd-key">P</button>
        </div>

        <div class="kbd-row kbd-row-offset">
          <button class="kbd-key">A</button>
          <button class="kbd-key">S</button>
          <button class="kbd-key">D</button>
          <button class="kbd-key">F</button>
          <button class="kbd-key">G</button>
          <button class="kbd-key">H</button>
          <button class="kbd-key">J</button>
          <button class="kbd-key">K</button>
          <button class="kbd-key">L</button>
        </div>

        <div class="kbd-row">
          <button class="kbd-key kbd-key-accent">
            <img
              src="https://cdn-icons-png.flaticon.com/512/2087/2087883.png"
              alt="Shift"
              class="h-5 w-5 object-contain"
            />
          </button>
          <button class="kbd-key">Z</button>
          <button class="kbd-key">X</button>
          <button class="kbd-key">C</button>
          <button class="kbd-key">V</button>
          <button class="kbd-key">B</button>
          <button class="kbd-key">N</button>
          <button class="kbd-key">M</button>
          <button class="kbd-key kbd-key-accent">
            <i class="fa-solid fa-delete-left text-base"></i>
          </button>
        </div>

        <div class="kbd-row kbd-row-bottom">
          <button class="kbd-key kbd-key-accent w-auto px-4">123</button>
          <button class="kbd-key kbd-key-accent">
            <svg class="h-5 w-5" fill="white" viewBox="0 0 20 20">
              <path
                d="M10 18c-4.418 0-8-4.03-8-9s3.582-9 8-9 8 4.03 8 9-3.582 9-8 9zm0-2a7.001 7.001 0 006.938-6H3.062A7.001 7.001 0 0010 16z"
              />
            </svg>
          </button>
          <button class="kbd-key kbd-key-accent">
            <svg class="h-5 w-5" fill="white" viewBox="0 0 20 20">
              <path d="M10 1a2 2 0 00-2 2v14a2 2 0 104 0V3a2 2 0 00-2-2z" />
            </svg>
          </button>
          <button class="kbd-key kbd-key-space">space</button>
          <button class="kbd-key kbd-key-accent w-auto px-4">Search</button>
        </div>
      </div>
    </div>
  </body>
</html>
