<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Reviews 3</title>
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <link href="./output.css" rel="stylesheet" />
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css"
      integrity="sha512DTOQO9RWCH3ppGqcWaEA1BIZOC6xxalwEsw9c2QQeAIftl+Vegovlnee1c9QX4TctnWMn13TZye+giMm8e2LwA=="
      crossorigin="anonymous"
      referrerpolicy="noreferrer"
    />
  </head>
  <body
    class="w-screen min-h-screen flex items-center justify-center bg-gray-200 md:p-6 pt-4 bg-cover bg-center"
    style="
      background-image: url(https://images.unsplash.com/photo-1596367407372-96cb88503db6?w=900&auto=format&fit=crop&q=60&ixlib=rb-4.1.0&ixid=M3wxMjA3fDB8MHxzZWFyY2h8M3x8d2hpdGV8ZW58MHwwfDB8fHww);
    "
  >
    <div class="w-11/12 max-w-md bg-gray-100 p-1.5 rounded-xl shadow-xl">
      <div
        class="flex flex-col w-full bg-gray-100 hover:translate-10 duration-300 ease-in-out rounded-lg p-6 hover:shadow-gray-400 hover:shadow-xl"
      >
        <div class="flex items-center justify-between w-full">
          <p class="text-2xl font-semibold text-gray-700">
            What others <br />
            think about the <br />
            product
          </p>
          <div
            class="cursor-pointer max-w-xs p-3 bg-white rounded-lg hover:shadow-lg duration-300 ease-in-out"
          >
            <div class="flex items-center justify-center gap-2 mb-1">
              <i class="fa-solid text-4xl fa-star text-yellow-400"></i>
              <span class="text-2xl font-bold text-gray-700">4.8</span>
            </div>
            <p class="text-gray-500 text-center text-sm">
              Average <br />
              customer rating
            </p>
          </div>
        </div>
        <div class="w-full mt-6 rounded-full p-3 bg-white flex items-center">
          <i class="fa-solid fa-magnifying-glass text-lg text-gray-400"></i>
          <input
            type="text"
            placeholder="Search topics and reviews"
            class="w-full outline-none border-none bg-transparent ml-3 text-gray-500 placeholder:text-gray-400"
          />
        </div>

        <div class="mt-10">
          <p>Reviews</p>

          <div>
            <div class="flex items-center gap-2 my-2">
              <span class="w-3 text-sm font-bold">5</span>
              <i class="fa-solid fa-star text-yellow-400"></i>
              <div
                class="w-full h-1.5 rounded-full border border-gray-500/40 bg-gray-300 shadow-inner shadow-gray-600/50"
              >
                <div class="w-[80%] h-full rounded-full bg-yellow-400"></div>
              </div>
              <span class="text-sm font-bold">106</span>
            </div>
            <div class="flex items-center gap-2 my-2">
              <span class="w-3 text-sm font-bold">4</span>
              <i class="fa-solid fa-star text-yellow-400"></i>
              <div
                class="w-full h-1.5 rounded-full border border-gray-500/40 bg-gray-300 shadow-inner shadow-gray-600/50"
              >
                <div class="w-[30%] h-full rounded-full bg-yellow-400"></div>
              </div>
              <span class="text-sm font-bold pr-2">32</span>
            </div>
            <div class="flex items-center gap-2 my-2">
              <span class="w-3 text-sm font-bold">4</span>
              <i class="fa-solid fa-star text-yellow-400"></i>
              <div
                class="w-full h-1.5 rounded-full border border-gray-500/40 bg-gray-300 shadow-inner shadow-gray-600/50"
              ></div>
              <span class="text-sm font-bold pr-4">0</span>
            </div>
            <div class="flex items-center gap-2 my-2">
              <span class="w-3 text-sm font-bold">3</span>
              <i class="fa-solid fa-star text-yellow-400"></i>
              <div
                class="w-full h-1.5 rounded-full border border-gray-500/40 bg-gray-300 shadow-inner shadow-gray-600/50"
              ></div>
              <span class="text-sm font-bold pr-4">0</span>
            </div>
            <div class="flex items-center gap-2 my-2">
              <span class="w-3 text-sm font-bold">2</span>
              <i class="fa-solid fa-star text-yellow-400"></i>
              <div
                class="w-full h-1.5 rounded-full border border-gray-500/40 bg-gray-300 shadow-inner shadow-gray-600/50"
              ></div>
              <span class="text-sm font-bold pr-4">0</span>
            </div>
            <div class="flex items-center gap-2 my-2">
              <span class="w-3 text-sm font-bold">1</span>
              <i class="fa-solid fa-star text-yellow-400"></i>
              <div
                class="w-full h-1.5 rounded-full border border-gray-500/40 bg-gray-300 shadow-inner shadow-gray-600/50"
              ></div>
              <span class="text-sm font-bold pr-4">0</span>
            </div>
          </div>
          <div class="mt-6">
            <button
              class="px-3 bg-black text-sm text-white font-bold py-2 rounded-full cursor-pointer hover:bg-gray-800 hover:shadow-lg active:bg-gray-700 active:scale-95 duration-300 ease-in-out"
            >
              Write a review
            </button>
          </div>
        </div>
      </div>
    </div>
  </body>
</html>
