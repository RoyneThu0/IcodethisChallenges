<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Notification 2</title>

    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <link href="./output.css" rel="stylesheet" />
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css"
      crossorigin="anonymous"
      referrerpolicy="noreferrer"
    />
    <style>
      @keyframes shake {
        0%,
        60%,
        100% {
          transform: translateX(0) rotate(0deg);
        }
        5%,
        15%,
        25%,
        35%,
        45% {
          transform: translateX(-2.5px) rotate(-0.5deg);
        }
        10%,
        20%,
        30%,
        40%,
        50% {
          transform: translateX(2.5px) rotate(0.5deg);
        }
      }
      .animate-shake {
        animation: shake 1.6s cubic-bezier(0.36, 0.07, 0.19, 0.97) infinite;
        transition:
          transform 300ms ease-out,
          box-shadow 300ms ease-out;
      }
      .animate-shake:hover {
        animation: none;
        transform: translateY(-8px);
        box-shadow:
          0 25px 35px -10px rgb(0 0 0 / 0.25),
          0 10px 15px -8px rgb(0 0 0 / 0.15);
      }
      @media (prefers-reduced-motion: reduce) {
        .animate-shake {
          animation: none;
        }
      }
    </style>
  </head>
  <body
    class="w-screen min-h-screen flex items-center bg-gray-100 justify-center p-3"
  >
    <div
      class="flex items-center flex-col gap-3 w-11/12 max-w-sm lg:max-w-4xl lg:grid lg:grid-cols-[20rem_1fr] lg:items-start lg:gap-x-10 lg:gap-y-6"
    >
      <div
        class="w-full rounded-full bg-gradient-to-r from-gray-400 via-gray-700 to-gray-900 p-2 flex items-center justify-between shadow-xl lg:col-start-2 lg:row-start-1 lg:self-center"
      >
        <div class="flex w-full items-center justify-start">
          <img
            src="https://i.pinimg.com/736x/5c/fb/1b/5cfb1bec148fb4d026a68345cee2d397.jpg"
            alt=""
            class="w-12 h-12 shrink-0 rounded-full border-3 border-gray-400 shadow-xl hover:border-green-300 duration-300 ease-in-out"
          />
          <div class="w-full ml-3">
            <p class="font-bold text-white text-sm">
              Lela hale <span class="font-normal">commented on your post</span>
            </p>
            <p class="text-gray-200 text-xs">2 HOURS AGO</p>
          </div>
        </div>
        <p class="pr-3">
          <i class="fa-solid fa-chevron-right text-white text-lg"></i>
        </p>
      </div>

      <div
        class="w-full max-w-xs p-6 bg-white rounded-lg flex justify-center items-center flex-col shadow-xl animate-shake lg:col-start-1 lg:row-start-1 lg:row-span-2 lg:max-w-none"
      >
        <p class="text-center text-gray-500 text-xs">INCOMING CALL</p>

        <img
          src="https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcQyYgys3qAvS7eP7vzXmRqHcYnbMHyokIfsyBIneZEW26ZreL2CXaxR7cnpaSruzB_Pt_0&usqp=CAU"
          alt=""
          class="w-20 h-20 mt-3 shrink-0 rounded-full border-6 border-gray-800 shadow-xl shadow-gray-600/50 hover:border-green-500 hover:scale-115 hover:animate-none duration-300 ease-in-out animate-pulse"
        />
        <p class="mt-2 text-base font-semibold">Jessie Burke</p>
        <div class="mt-3 w-full flex items-center justify-center gap-8">
          <div
            class="bg-red-600 px-4 py-2 rounded-full border-3 border-red-400/90"
          >
            <p class="text-white font-semibold text-sm">Decline</p>
          </div>
          <div
            class="bg-green-600 px-4 py-2 rounded-full border-3 border-green-400/90"
          >
            <p class="text-white font-semibold text-sm">Accept</p>
          </div>
        </div>
      </div>

      <div
        class="w-full max-w-xs p-6 bg-white rounded-lg flex justify-center items-center flex-col shadow-xl lg:col-start-2 lg:row-start-2 lg:row-span-2 lg:max-w-sm lg:mx-auto"
      >
        <img
          src="https://www.freeiconspng.com/uploads/sms-icon-16.png"
          alt=""
          class="w-20 h-20 shrink-0"
        />
        <p class="mt-2 text-base text-center">
          Do you want to allow push notifications?
        </p>
        <div class="mt-3 w-full flex items-center justify-center gap-10">
          <div
            class="hover:bg-red-600 duration-300 px-6 py-2 rounded-full border-3 border-gray-300"
          >
            <p class="text-black font-semibold text-sm">No</p>
          </div>
          <div
            class="hover:bg-green-500 duration-300 bg-gray-800 px-6 py-2 rounded-full shadow-lg"
          >
            <p class="text-white font-semibold text-sm">Yes</p>
          </div>
        </div>
      </div>

      <div
        class="relative shrink-0 lg:col-start-1 lg:row-start-3 lg:justify-self-center"
      >
        <div
          class="w-20 h-20 bg-gray-800 rounded-2xl flex items-center justify-center shadow-xl hover:scale-110 duration-300 ease-in-out"
        >
          <i class="fa-brands fa-twitter text-white text-4xl"></i>
        </div>
        <span
          class="absolute -top-2 -right-2 w-7 h-7 rounded-full bg-blue-500 text-white text-sm font-semibold flex items-center justify-center shadow-lg"
          >7</span
        >
      </div>
    </div>
  </body>
</html>
